name: SDK CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Test and pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run SDK tests
        run: pnpm test

      - name: Verify packed consumer
        run: pnpm pack:check

      - name: Check the integration skill (templates type-check, links, error codes)
        run: pnpm skill:check

      - name: Pack the integration skill
        run: pnpm skill:pack

      - name: Upload the skill zip
        uses: actions/upload-artifact@v4
        with:
          name: facta-dte-api-skill
          path: dist/facta-dte-api-skill.zip
          if-no-files-found: error

  playground:
    name: Playground (typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck the playground
        run: pnpm playground:typecheck

      - name: Test the playground
        run: pnpm playground:test

      - name: Build the site and bundle the Worker (no deploy)
        run: pnpm playground:deploy:check
