name: SDK live integration (test environment)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Issue one FE (01) for $0.01 in the Facta test environment
        required: true
        type: choice
        options:
          - skip
          - emit-test-fe

permissions:
  contents: read

jobs:
  live-test:
    if: inputs.confirmation == 'emit-test-fe'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build && node scripts/live-integration.mjs
        env:
          STAGING_FACTA_API_KEY: ${{ secrets.STAGING_FACTA_API_KEY }}
          STAGING_FACTA_SIGN_KEY: ${{ secrets.STAGING_FACTA_SIGN_KEY }}
          STAGING_FACTA_UNLOCK_KEY: ${{ secrets.STAGING_FACTA_UNLOCK_KEY }}
