name: SDK live integration (staging API, test environment)

on:
  pull_request:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      confirmation:
        description: Issue one FE (01) for $0.01 in the Facta test environment
        required: true
        type: choice
        options:
          - skip
          - emit-test-fe

permissions:
  contents: read

jobs:
  live-test:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.confirmation == 'emit-test-fe') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment:
      name: staging-live-test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Build SDK and run staging API integration
        run: pnpm build && node scripts/live-integration.mjs
        env:
          STAGING_FACTA_API_KEY: ${{ secrets.STAGING_FACTA_API_KEY }}
          STAGING_FACTA_SIGN_KEY: ${{ secrets.STAGING_FACTA_SIGN_KEY }}
          STAGING_FACTA_UNLOCK_KEY: ${{ secrets.STAGING_FACTA_UNLOCK_KEY }}
          STAGING_FACTA_API_BASE_URL: https://eobxzotnqzgtpuqvmpkc.supabase.co/functions/v1/api-v1
