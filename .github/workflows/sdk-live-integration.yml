name: SDK live integration (staging API, test environment)

concurrency:
  group: sdk-staging-live
  cancel-in-progress: false

on:
  pull_request:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      confirmation:
        description: Issue one FE (01) for $0.01 in the Facta test environment
        required: true
        type: choice
        options:
          - skip
          - emit-test-fe

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  live-test:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.confirmation == 'emit-test-fe') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment:
      name: staging-live-test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Build SDK and run staging API integration
        run: pnpm build && node scripts/live-integration.mjs
        env:
          STAGING_FACTA_API_KEY: ${{ secrets.STAGING_FACTA_API_KEY }}
          STAGING_FACTA_SIGN_KEY: ${{ secrets.STAGING_FACTA_SIGN_KEY }}
          STAGING_FACTA_UNLOCK_KEY: ${{ secrets.STAGING_FACTA_UNLOCK_KEY }}
          STAGING_FACTA_API_BASE_URL: https://eobxzotnqzgtpuqvmpkc.supabase.co/functions/v1/api-v1
          FACTA_LIVE_REPORT_DIR: ${{ runner.temp }}/facta-live-report
      - name: Add live result to pull request
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v8
        env:
          RESULT: ${{ job.status }}
          REPORT_PATH: ${{ runner.temp }}/facta-live-report/report.md
        with:
          script: |
            const marker = '<!-- facta-sdk-staging-live-result -->';
            const fs = require('node:fs');
            const report = fs.existsSync(process.env.REPORT_PATH)
              ? fs.readFileSync(process.env.REPORT_PATH, 'utf8')
              : '';
            const body = [
              marker,
              `## SDK staging live test: ${process.env.RESULT}`,
              '',
              report || 'No invoice report was produced. This run does not establish that an invoice was generated; inspect the failed step in the workflow logs.',
              '',
              `[Open workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(comment => comment.body.includes(marker));
            const params = { owner: context.repo.owner, repo: context.repo.repo, body };
            if (existing) {
              await github.rest.issues.updateComment({ ...params, comment_id: existing.id });
            } else {
              await github.rest.issues.createComment({ ...params, issue_number: context.issue.number });
            }
