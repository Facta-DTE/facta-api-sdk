name: Playground deploy

# `dev`  -> Worker `facta-playground-dev` on workers.dev (for review)
# `main` -> Worker `facta-playground` at https://playground.factadte.com
# Both talk to the STAGING API only; the Worker itself refuses anything else.
# Required repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# (see playground/README.md). Without them this workflow validates and skips the upload.

on:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: playground-deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy playground
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and test
        run: |
          pnpm playground:typecheck
          pnpm playground:test

      - name: Build the site
        run: pnpm playground:build

      - name: Deploy (dev)
        if: github.ref_name == 'dev' && env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm exec wrangler deploy -c playground/wrangler.jsonc --env ""

      - name: Deploy (main)
        if: github.ref_name == 'main' && env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm exec wrangler deploy -c playground/wrangler.jsonc --env production

      - name: Explain a skipped upload
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set; the playground was validated but not uploaded."
