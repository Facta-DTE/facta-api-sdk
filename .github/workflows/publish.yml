name: Stage npm release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  stage-release:
    name: Validate and stage package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

          version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$version" ]]; then
            echo "Git tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

          if [[ "$version" == *-* ]]; then
            dist_tag="${version#*-}"
            dist_tag="${dist_tag%%.*}"
          else
            dist_tag="latest"
          fi
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run SDK tests
        run: pnpm test

      - name: Verify packed consumer
        run: pnpm pack:check

      - name: Use npm CLI with trusted publishing support
        run: npm install --global npm@11.21.0

      - name: Stage package for manual npm approval
        run: npm stage publish --access public --tag "${{ steps.release.outputs.dist_tag }}"
