name: Publish npm release

on:
  push:
    tags:
      - "v*"

permissions:
  # write: the job attaches the skill zip and the npm tarball to a GitHub Release.
  contents: write
  id-token: write

jobs:
  publish-release:
    name: Validate and publish package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

          version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$version" ]]; then
            echo "Git tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

          if [[ "$version" == *-* ]]; then
            dist_tag="${version#*-}"
            dist_tag="${dist_tag%%.*}"
          else
            dist_tag="latest"
          fi
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run SDK tests
        run: pnpm test

      - name: Verify packed consumer
        run: pnpm pack:check

      - name: Use npm CLI with trusted publishing support
        run: npm install --global npm@11.21.0

      - name: Publish package with trusted publishing
        run: npm publish --access public --tag "${{ steps.release.outputs.dist_tag }}"

      # Every npm version also gets a GitHub Release with the agent skill zip and the exact
      # tarball npm received, so the skill can be downloaded without npm.
      - name: Pack the agent skill and the release tarball
        # npm pack runs prepack, which rebuilds (and empties) dist/: pack the tarball FIRST,
        # then the skill zip, or the zip is gone before the release step looks for it.
        run: |
          npm pack --pack-destination dist
          pnpm skill:pack
          ls -l dist/facta-dte-api-skill.zip dist/facta-dte-api-*.tgz

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          notes="$(awk -v v="$version" '$0 ~ "^## "v" " {f=1; next} f && /^## / {exit} f' CHANGELOG.md)"
          prerelease=""
          [[ "$version" == *-* ]] && prerelease="--prerelease"
          gh release create "$GITHUB_REF_NAME" \
            dist/facta-dte-api-skill.zip "dist/facta-dte-api-${version}.tgz" \
            --title "@facta-dte/api ${version}" \
            --notes "${notes:-See CHANGELOG.md.}" \
            --verify-tag $prerelease

