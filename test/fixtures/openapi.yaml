components:
  securitySchemes:
    FactaApiKey:
      type: apiKey
      in: header
      name: X-Facta-Key
      description: |
        `facta_test_<id>.<secreto>` en pruebas, `facta_live_<id>.<secreto>` en
        producción. La parte antes del punto es pública e identifica la fila; la
        de después se muestra UNA vez al acuñarla y no se guarda (solo su
        SHA-256 con pimienta).

        El prefijo y el ambiente de la fila tienen que coincidir: una llave
        `facta_test_` que apuntara a una fila de producción es 403, jamás una
        emisión.

        **Nunca en `Authorization`.** El gateway lee esa cabecera por su cuenta.

        **Esta llave sola no firma.** Abre nada: identifica y autentica. Para
        firmar hace falta además `X-Facta-Sign-Key` (ver los dos vaults del
        plan, §6).

        **Lista de IP autorizadas** (opcional, se define al acuñar la llave):
        cada entrada es una dirección —`190.53.1.2`, `2001:db8::1`— o un rango
        en notación CIDR —`190.53.1.0/24`, `2001:db8::/32`—, IPv4 o IPv6. Un
        integrador detrás de un NAT con varias salidas pone su prefijo, no cada
        dirección. La lista vacía significa «desde cualquier parte». Si la llave
        tiene lista y tu IP no está en ninguna de sus entradas, la respuesta es
        `ip_not_allowed` (403) antes de cualquier trabajo. La IP que se compara
        es la del extremo que nos conecta, y una cabecera `X-Forwarded-For`
        puesta por el cliente no la cambia.

  parameters:
    CodigoGeneracion:
      name: codigoGeneracion
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: 7875BC7A-9580-441D-94E4-FA455E9D8BD0
    SignKey:
      name: X-Facta-Sign-Key
      in: header
      required: true
      schema: { type: string, pattern: "^factask_[A-Za-z0-9_-]{43}$" }
      description: |
        La contraseña que abre **el vault de firma**, donde vive el certificado
        del emisor. 256 bits generados por el navegador en la ceremonia de
        acuñado y mostrados UNA vez.

        Por qué existe: en la web hay dos secretos independientes (la sesión y
        la llave del vault, que nunca viaja) y robar uno no basta. En una API
        hay un solo token, y si ese token bastara para firmar, un `.env`
        filtrado sería poder de emitir DTE reales con el certificado del
        cliente. Con esta separación, **el token robado no firma**.

        Qué hacemos con ella: se convierte a bytes al entrar, se deriva la KEK
        por HKDF-SHA-256, se abre la envoltura y el arreglo se pone a cero. No
        se guarda, no se registra en ninguna bitácora y no hay hash de ella en
        nuestra base — el verificador es la propia etiqueta GCM de la
        envoltura. Lo que sí guardamos es el CONTEO de intentos fallidos: cinco
        seguidos en una hora suspenden la llave.

        **No es `FACTA_UNLOCK_KEY`.** Esa otra (prefijo `factauk_`) abre sus
        credenciales de almacenamiento en SU servidor y no viaja nunca a Facta.
        Si la manda aquí, la respuesta se lo dice en vez de intentarlo.

    DeferCopies:
      name: X-Facta-Copies
      in: header
      required: false
      schema: { type: string, enum: [deferred] }
      description: |
        **Opcional, para quien prefiere la respuesta rápida.** Con
        `X-Facta-Copies: deferred` la respuesta sale en cuanto el documento está
        sellado, el índice escrito y la hoja dibujada, y las dos copias (área de
        retención y almacenamiento administrado) se escriben **después**. La
        respuesta lo dice con la verdad: `almacenamiento: "pendiente"` y un
        recibo `storage` en estado `pending` con `errorCode: "write_deferred"`.
        Nada se pierde: el documento y la hoja ya vienen en la respuesta, y
        `GET /v1/storage/copies/{codigoGeneracion}` muestra cuándo aterrizan las
        copias (si una falla, el barrido de reparación la reintenta). Sin la
        cabecera todo sigue como siempre: la respuesta espera las copias.

    DebugTimings:
      name: X-Facta-Debug
      in: header
      required: false
      schema: { type: string, enum: [timings] }
      description: |
        **Función de soporte, no de uso normal.** Con `X-Facta-Debug: timings`,
        y solo si la llave está autorizada, la respuesta trae además un
        miembro `debug` con códigos de diagnóstico para el equipo de soporte de
        Facta, y la cabecera `Server-Timing` con el tiempo total.

        ```json
        "debug": { "ref": "k3q9m0x7ptd2", "t": "A1:12,V1:40,H4:812" }
        ```

        · Disponible para las llaves de pruebas (`facta_test_`) y para las
          llaves de producción que Facta haya habilitado. Con cualquier otra
          llave, o si la llave no es válida, la respuesta no cambia en un byte
          y la cabecera se ignora.
        · `ref` es una referencia aleatoria: dígasela a soporte junto con la
          hora de la petición.
        · `t` son pares `código:milisegundos`. El significado de cada código
          no es público y puede cambiar sin aviso; no construya lógica sobre
          él. Soporte lo interpreta con su propio catálogo.
        · `Server-Timing` lleva solo `total;dur=<ms>`.
        · Aplica a `POST /v1/dte`, `POST /v1/dte/prepare`, `POST /v1/dte/sign`,
          `GET /v1/dte` y a la descarga `GET /v1/dte/{codigoGeneracion}/file`
          (esta última solo con `Server-Timing`, porque la respuesta son los
          bytes del archivo). En otras rutas se ignora.
        · Una repetición por `Idempotency-Key` también lo acepta; el informe
          describe esa repetición y no se guarda.

    IdempotencyKeyOpcional:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 200 }
      example: cliente-alta-00417
      description: |
        Opcional en las altas del catálogo (crear es reversible: se desactiva).
        Con ella valen las mismas reglas que en las rutas irreversibles
        (`#/components/parameters/IdempotencyKey`): misma cadena y mismo cuerpo
        devuelve la respuesta guardada con `Idempotency-Replayed: true`; otro
        cuerpo es `422 idempotency_key_reuse` (salvo en las altas de cliente y
        producto, donde actualiza el registro que la llave creó); TTL de 24 h.
    CatalogoId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: 9f1c2b6e-3a47-4d0e-8b53-1f2a6c7d8e90
    CatalogoBuscar:
      name: buscar
      in: query
      required: false
      schema: { type: string, maxLength: 100 }
      description: Texto a buscar (nombre o documento en clientes; descripción, código o código de barras en productos).
    CatalogoLimite:
      name: limite
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    CatalogoCursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
      description: El `siguiente` de la página anterior. Opaco.
    CatalogoInactivos:
      name: incluirInactivos
      in: query
      required: false
      schema: { type: boolean, default: false }
      description: Con `true` también salen los desactivados.
    RequestFingerprint:
      name: X-Facta-Request-Fingerprint
      in: header
      required: false
      schema: { type: string, pattern: "^[0-9a-f]{64}$" }
      description: |
        **Opcional.** SHA-256 en hexadecimal minúscula de la petición TAL COMO
        LA ESCRIBIÓ quien llama, antes de que ninguna biblioteca la complete.
        Solo se lee en `POST /v1/dte` y `POST /v1/dte/prepare`; en cualquier
        otra ruta se ignora. Con ella, la comparación de `Idempotency-Key` usa
        esta huella en lugar del cuerpo: un cliente que resuelve `customerId` o
        `productId` desde su copia del catálogo puede reintentar la misma venta
        después de que el catálogo cambió y obtiene la respuesta guardada, no
        un `422 idempotency_key_reuse`. Una huella distinta con la misma llave
        sigue siendo 422, y una cabecera que no sea 64 caracteres
        hexadecimales en minúscula es `400 invalid_request`. El alcance no
        cambia: `(llave, Idempotency-Key)`. Si el primer intento no la mandó y
        el reintento sí (o al revés), la respuesta es 422.

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, maxLength: 200 }
      example: venta-2026-09-02-00417
      description: |
        Identificador que el CLIENTE elige para esta operación. Obligatorio en
        toda ruta que no se pueda deshacer: las tres que gastan correlativo y la
        anulación. Sin él, un reintento por timeout quemaría un segundo número —
        o mandaría un segundo evento contra un documento que el primero ya
        anuló.

        Reglas, todas verificables:

        · **Alcance** `(llave, Idempotency-Key)`. Dos integradores pueden usar
          la misma cadena sin chocar, y ninguno puede leer la respuesta del otro.
        · **Repetir la misma llave con el MISMO cuerpo** devuelve la respuesta
          guardada, con `Idempotency-Replayed: true`. Eso incluye un rechazo del
          MH: el reintento devuelve el mismo 422, sin quemar otro número.
        · **Repetir con OTRO cuerpo** es 422 `idempotency_key_reuse`. Devolver
          la factura de ayer para la venta de hoy es peor que fallar. Si la
          primera petición ya terminó, `details` nombra su `codigoGeneracion`.
          **Excepción: las altas de cliente y producto** (`POST /v1/customers`,
          `POST /v1/products`). Ahí el otro cuerpo se aplica al registro que la
          llave creó (semántica de `PATCH`) y la respuesta es `200` con
          `actualizado: true`; solo si esa llave no guarda un registro vuelve el 422.
        · **Mientras la primera está en vuelo**, la segunda es 409
          `idempotency_in_flight` — no se encola. El cliente reintenta.
        · **TTL 24 h.** Pasado eso la cadena queda libre: un reintento un día
          después es una venta nueva, no un reintento.

  headers:
    RateLimitLimit:
      schema: { type: integer }
      description: El techo de la ventana más cercana a morder.
    RateLimitRemaining:
      schema: { type: integer }
      description: Lo que queda de ESA ventana, con esta petición ya descontada.
    RateLimitReset:
      schema: { type: integer }
      description: |
        Segundos hasta que esa ventana se libera del todo. Es la longitud
        entera de la ventana deslizante (3600 u 86400), no un instante
        calculado: el momento exacto en que se libera un turno es cuando la
        petición más vieja de la ventana cumple una hora, y saberlo costaría
        otra consulta. Redondear hacia arriba nunca dice «vuelva» antes de
        tiempo.
    RateLimitPolicy:
      schema: { type: string }
      description: Las dos ventanas, `hour;q=60;w=3600, day;q=300;w=86400`.
    RetryAfter:
      schema: { type: integer }
      description: Segundos que conviene esperar. Solo en los errores donde esperar arregla algo.
    IdempotencyReplayed:
      schema: { type: boolean }
      description: |
        Presente y `true` cuando la respuesta salió de la caché de idempotencia.

        Sale también sobre un **error** guardado: un rechazo del MH se repite
        con su mismo 422 y su mismo correlativo gastado, que es justo lo que
        evita que el reintento queme un segundo número.

  responses:
    NoAutorizado:
      description: |
        `unauthorized` (no vino llave) o `invalid_api_key` (no sirve). Las dos
        tardan lo mismo, a propósito.

        En las rutas que firman se suman las dos del segundo factor:
        `sign_key_required` (falta `X-Facta-Sign-Key`, o vino la de apertura por
        error) y `sign_key_invalid` (no abre el vault). `details.intentosRestantes`
        dice cuántos quedan antes de que la llave se suspenda sola.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Prohibido:
      description: |
        La llave existe pero no puede: `key_revoked`, `key_expired`,
        `key_inactive`, `forbidden_scope`, `dte_type_not_allowed`,
        `ip_not_allowed`, `environment_not_allowed` o `sign_vault_locked`
        (demasiados intentos fallidos de abrir el vault: esperar no lo arregla,
        hay que reactivar la llave desde la app).
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    EnVuelo:
      description: |
        `idempotency_in_flight` — la primera petición con esa llave todavía
        trabaja. `details.enVueloSegundos` dice desde cuándo.

        **Si esa primera petición ya había empezado algo que no se deshace**
        —un correlativo reservado, o una anulación camino de Hacienda— el
        mensaje NOMBRA el documento (`details.codigoGeneracion`) para que se
        pueda preguntar `GET /v1/dte/{codigoGeneracion}` qué fue de él, en vez
        de esperar las 24 h del reclamo. Si no había llegado a eso, no pasó nada
        irreversible y el barrido de cinco minutos suelta el reclamo solo a la
        media hora (`details.seLiberaSola`).
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    EnVueloOSinVault:
      description: |
        `idempotency_in_flight` (la primera petición con esa llave todavía
        trabaja — reintenta) o `sign_vault_missing` (la llave no está
        provisionada para firmar — reintentar no la arregla, hay que acuñarla
        de nuevo desde la app). El `code` los distingue.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Techo:
      description: |
        `rate_limited` (por hora, por día, o la ventana propia de `/v1/status`)
        o `amount_limit` (el documento pasa del monto máximo de la llave). El de
        monto se comprueba ANTES de reservar: no gasta correlativo.

        `details.window` dice cuál de las tres fue.
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
        RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    MhCaido:
      description: |
        `mh_unreachable` — no llegamos a Hacienda. Nadie juzgó nada.

        **RESERVADO: la versión actual nunca lo devuelve.** Todo fallo de
        transporte al MH —caída, timeout, respuesta ilegible, «PROCESADO» sin
        sello— sale como **202 contingencia**, porque para entonces el documento
        YA está firmado y se le debe a Hacienda; un 502 invitaría a reintentar y
        el reintento firmaría un segundo documento. El código se queda en la
        taxonomía para el día en que exista un fallo ANTES de firmar que sí se
        pueda reintentar.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    CatalogoPeticionInvalida:
      description: |
        `invalid_request` — cuerpo ausente o que no es JSON, un id o cursor que
        no tienen la forma debida, `limite` fuera de 1–200, o una edición vacía.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    CatalogoProhibido:
      description: |
        `catalog_write_disabled` — el dueño de la cuenta no ha permitido
        administrar el catálogo desde el API (`details.hint` dice dónde:
        Cuenta → API). Se comprueba antes que el alcance. Además, las del
        resto de las rutas: `forbidden_scope` si a la llave le falta
        `catalog:write`, y las demás de la llave.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    CatalogoCifrado:
      description: |
        `catalog_encrypted` — el catálogo de la empresa está cifrado y el
        servidor no puede leerlo. El dueño lo guarda sin cifrar en Cuenta → API.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    CatalogoConflicto:
      description: |
        `catalog_duplicate` — ya hay un cliente con ese documento o un producto
        con ese código (`details.id` y `details.activo`; si está desactivado,
        reactívelo con `PATCH`). También `catalog_encrypted` si una fila quedó
        cifrada a medias de una conversión.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    CatalogoInvalido:
      description: |
        `validation_failed` — `details.problemas` lista cada campo con su
        `code` y su `message` en español. No se guardó nada.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    CatalogoNoExiste:
      description: |
        `not_found` — no existe, es de otra empresa o esta llave lo excluye:
        las tres contestan igual.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NoDisponible:
      description: |
        `service_unavailable` o `correlative_unavailable` — algo nuestro no está
        listo. Puede salir en CUALQUIER ruta, incluidas las de consulta: el
        registro de peticiones se escribe antes de trabajar y falla cerrado, así
        que si esa tabla no contesta, nada contesta.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    ErrorInterno:
      description: "`internal_error`. El mensaje nunca describe nuestras entrañas."
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    EntregaPeticionInvalida:
      description: |
        `invalid_request` — el código de generación no tiene forma de UUID o
        falta el `token` en el cuerpo.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    EntregaNoAutorizada:
      description: |
        `unauthorized` / `invalid_api_key` (la llave) o `entrega_token_invalido`
        (el token no corresponde a este documento y canal, o el documento no
        tiene token porque estaba en contingencia al emitirse).
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    EntregaCanalNoMarcado:
      description: |
        `canal_no_marcado` — este documento no marcó ese canal al emitirse. Una
        entrega no se puede decidir después: se marca en `entrega` al emitir.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    EntregaVencida:
      description: |
        `entrega_vencida` — pasaron más de 5 minutos desde la emisión y el canal
        no se había entregado. El canal queda en `vencido` y no vuelve a
        habilitarse con ese token.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NoEnElArea:
      description: |
        `not_found` — igual para "ese documento no existe en el área de
        retención" que para "existe, pero es de otra empresa o de otro
        ambiente". **Nunca 403**: distinguir los dos casos confirmaría
        códigos de generación ajenos, y el código va impreso en cada factura.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Estable. Es sobre esto que un cliente decide qué hacer.
              enum:
                - unauthorized
                - invalid_api_key
                - key_revoked
                - key_expired
                - key_inactive
                - forbidden_scope
                - dte_type_not_allowed
                - ip_not_allowed
                - environment_not_allowed
                - sign_key_required
                - sign_key_invalid
                - sign_vault_locked
                - sign_vault_missing
                - invalid_request
                - include_limit_exceeded
                - validation_failed
                - retention_mixed_class_unsupported
                - not_found
                - method_not_allowed
                - idempotency_key_required
                - idempotency_key_reuse
                - idempotency_in_flight
                - prepare_token_invalid
                - return_exceeds_available
                - return_window_closed
                - return_type_not_allowed
                - return_pdf_unavailable
                - has_return_events
                - not_sealed
                - rate_limited
                - amount_limit
                - mh_rejected
                - mh_unreachable
                - correlative_unavailable
                - no_storage_destination
                - storage_unsupported
                - storage_unavailable
                - entrega_token_invalido
                - entrega_vencida
                - canal_no_marcado
                - catalog_write_disabled
                - catalog_encrypted
                - catalog_duplicate
                - service_unavailable
                - internal_error
            message:
              type: string
              description: Español, para el humano que lee el log. Puede cambiar.
            details:
              description: |
                Depende del código. `validation_failed` trae `issues`;
                `mh_rejected` trae `descripcionMsg`, `observaciones` y el
                correlativo gastado; `rate_limited` trae la ventana y
                `retryAfterSeconds`.

    Entrega:
      type: object
      description: |
        Qué canales entregan el documento una vez emitido. **Solo marca**: la
        entrega se pide después, con el token de la respuesta, y emitir nunca
        espera a ella. Sin este objeto no se entrega nada (las preferencias de
        correo de la empresa en la app no aplican a la API).

        Los dos canales vienen incluidos en toda llave que emite (`issue`).
        WhatsApp además necesita saldo en la billetera, y no se envía si la
        petición dice `consentimiento: false`; en esos casos la emisión sale
        igual y el canal lo reporta. Un `entrega` mal formado es `400 invalid_request` y no
        gasta correlativo.
      properties:
        correo:
          description: |
            `true` usa `receptor.correo` del documento; una dirección la usa
            solo para la entrega (el documento fiscal conserva `receptor.correo`).
          oneOf:
            - { type: boolean }
            - { type: string, format: email, maxLength: 254 }
        whatsapp:
          type: object
          required: [numero]
          additionalProperties: false
          properties:
            numero:
              type: string
              example: "+50370001234"
              description: |
                Con código de país, o 8 dígitos de El Salvador (se asume +503).
                Solo se guarda cifrado mientras la entrega está pendiente.
            consentimiento:
              type: boolean
              description: |
                Atestación de quien integra de que el receptor aceptó recibir
                documentos por WhatsApp. **Por defecto `true`**: pedir el canal
                ya es atestarlo. Solo `false` deja el canal en
                `sin_consentimiento` sin mandar nada. Se registra junto con la
                llave que la dio y la hora.

    EstadoDeCanal:
      type: string
      enum: [pendiente, en_proceso, enviado, fallido, sin_credito, sin_consentimiento, no_permitido, vencido, esperando_sello]
      description: |
        `pendiente` marcado y esperando su petición de entrega · `en_proceso` el
        proveedor aún no contesta · `enviado` el proveedor aceptó el mensaje ·
        `fallido` no se pudo (mire `motivo`) · `sin_credito` la billetera de
        WhatsApp no tiene saldo · `sin_consentimiento` falta la atestación ·
        `no_permitido` la llave no tiene el alcance del canal · `vencido` pasaron
        los 5 minutos sin entregarse · `esperando_sello` el documento estaba en
        contingencia al emitirse (no hay token; la entrega de estos queda para
        más adelante).

    CanalDeEntrega:
      type: object
      required: [estado, actualizado]
      properties:
        estado: { $ref: "#/components/schemas/EstadoDeCanal" }
        destino:
          type: string
          nullable: true
          example: "m•••@ejemplo.com"
          description: Siempre enmascarado (`m•••@ejemplo.com`, `+503 ••••-1234`).
        motivo:
          type: string
          description: |
            Código estable, presente cuando el estado lo necesita:
            `invalid_address` (sin dirección o rechazada) · `smtp_rejected` (el
            servicio de correo rechazó el envío) · `wallet_empty` · `quota_exceeded`
            (tope de envíos de la empresa o del documento) · `consent_not_attested`
            · `scope_missing` · `token_expired` · `contingency` ·
            `document_rejected` (el servidor de envío no aceptó el documento) ·
            `document_unavailable` (no se pudo rearmar el JSON/PDF) ·
            `provider_unavailable` · `provider_rejected` · `outcome_unknown` (el
            proveedor contestó ambiguo; no se reenvía solo) ·
            `delivery_unavailable` (no se pudo registrar la entrega; la emisión
            no se afectó).
        actualizado: { type: string, format: date-time }

    EntregaMarcada:
      type: object
      description: |
        Lo que la emisión devuelve cuando marcó canales. Sin `token` ni
        `venceEn` cuando no hay nada entregable (documento en contingencia, o
        ningún canal con alcance y consentimiento).
      required: [canales]
      properties:
        token:
          type: string
          example: fdt_Zk3m0Wc1x0Yf4n1q9gH7bB2dQ8vLrT5uJp6sAeCwNoM
          description: |
            Opaco, `fdt_` más 43 caracteres base64url (32 bytes). Vale **5
            minutos** desde la emisión, es del documento y de la llave, y no se
            guarda en claro. Trátelo como un secreto: quien lo tenga junto con
            la llave puede disparar la entrega.
        venceEn: { type: string, format: date-time }
        canales:
          type: object
          properties:
            correo: { $ref: "#/components/schemas/CanalDeEntrega" }
            whatsapp: { $ref: "#/components/schemas/CanalDeEntrega" }

    SolicitudEntrega:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token:
          type: string
          description: El `entrega.token` de la respuesta de emisión.

    EntregaDeCanal:
      allOf:
        - { $ref: "#/components/schemas/CanalDeEntrega" }
        - type: object
          required: [codigoGeneracion, canal]
          properties:
            codigoGeneracion: { type: string, format: uuid }
            canal: { type: string, enum: [correo, whatsapp] }

    EstadoDeEntrega:
      type: object
      required: [codigoGeneracion, ambiente, canales]
      properties:
        codigoGeneracion: { type: string, format: uuid }
        ambiente: { type: string, enum: ["00", "01"] }
        venceEn:
          type: string
          format: date-time
          description: Cuándo vence (o venció) el token; ausente si el documento no tuvo token.
        tokenVigente: { type: boolean }
        canales:
          type: object
          properties:
            correo: { $ref: "#/components/schemas/CanalDeEntrega" }
            whatsapp: { $ref: "#/components/schemas/CanalDeEntrega" }

    Direccion:
      type: object
      description: Códigos del catálogo oficial del MH (CAT-012/013), no nombres.
      required: [departamento, municipio, complemento]
      properties:
        departamento: { type: string, example: "06" }
        municipio: { type: string, example: "20" }
        distrito: { type: string, example: "01" }
        complemento: { type: string, example: "CC Metrocentro San Miguel, Local 105" }

    Receptor:
      type: object
      description: |
        Un cliente guardado (`customerId`) se resuelve de dos maneras según la
        llave. Con **«Catálogo legible por la API»** el servidor lo lee del
        catálogo que la app publicó para esa llave (sin clave de desbloqueo). Con
        el catálogo **cifrado**, el SDK de TypeScript lo resuelve desde el
        catálogo cifrado local y envía los campos completos; una llamada HTTP
        directa debe enviar el receptor completo, porque el servidor no puede
        descifrar las filas canónicas.
        Los campos inline se usan para este DTE y no crean ni actualizan una
        ficha del catálogo de clientes.
        Cuando se manda el receptor resuelto, los campos explícitos ganan sobre
        los datos guardados.

        Un CCF (03) exige `numDocumento` (NIT), `nrc`, `nombre`, `codActividad`,
        `direccion` y `correo`. Una FE (01) admite el receptor entero, parcial o
        ninguno — sin receptor es el consumidor final anónimo, que es legal.
      properties:
        customerId:
          type: string
          format: uuid
          description: |
            Un cliente guardado. El servidor lo resuelve solo en una llave con
            «Catálogo legible por la API» (`llave.catalogMode: readable`) o en
            cualquier llave de una empresa con el catálogo sin cifrar
            (`llave.catalogoSinCifrar: true`); en una
            llave con catálogo cifrado lo resuelve el SDK de TypeScript en local
            y una llamada directa debe enviar los campos completos.
        nombre: { type: string }
        tipoDocumento: { type: string, description: "CAT-022. 36 = NIT, 13 = DUI.", example: "36" }
        numDocumento: { type: string, example: "05110606161016" }
        nrc: { type: string, example: "2513113" }
        codActividad: { type: string, example: "46510" }
        descActividad: { type: string }
        direccion: { $ref: "#/components/schemas/Direccion" }
        telefono: { type: string, nullable: true }
        correo: { type: string, format: email }

    DocumentoRelacionado:
      type: object
      description: |
        El documento sellado que una nota ajusta. Dos formas:

        · **Por código** — `{ "codigoGeneracion": "…" }` y nada más. El servidor
          lee el tipo y la fecha del índice de su empresa. Es la forma que usa
          quien emitió el original por esta misma API.
        · **Entera** — `tipoDocumento`, `numeroDocumento` y `fechaEmision`, para
          ajustar algo que no está en nuestro índice.

        Un código que no está en su índice es `404`; uno que está pero sin sello
        es `400` — Hacienda no selló nada que ajustar.
      properties:
        codigoGeneracion: { type: string, format: uuid }
        tipoDocumento: { type: string, example: "03" }
        numeroDocumento: { type: string, maxLength: 36 }
        fechaEmision: { type: string, format: date }
        tipoGeneracion:
          type: integer
          enum: [1, 2]
          default: 2
          description: 1 en papel, 2 electrónico.

    ReceptorExportacion:
      type: object
      description: |
        Quien compra desde fuera del país. No tiene NRC ni dirección con códigos
        del catálogo: tiene país, una dirección en texto y si es persona o
        empresa. Su `descActividad` es texto libre — el registro del Ministerio
        solo cubre a contribuyentes salvadoreños.
      required: [nombre, numDocumento, codPais, nombrePais, complemento, tipoPersona, descActividad, correo]
      properties:
        nombre: { type: string }
        numDocumento: { type: string, description: Identificación fiscal extranjera o pasaporte. }
        tipoDocumento: { type: string, default: "37", description: "CAT-022; por defecto «otro»." }
        codPais: { type: string, minLength: 2, maxLength: 2, description: CAT-020., example: "US" }
        nombrePais: { type: string, minLength: 3, maxLength: 50 }
        complemento: { type: string, description: La dirección, en texto libre. }
        tipoPersona: { type: integer, enum: [1, 2], description: 1 natural, 2 jurídica. }
        descActividad: { type: string, minLength: 5, maxLength: 150 }
        correo: { type: string, format: email }
        telefono: { type: string, nullable: true }
        nombreComercial: { type: string, nullable: true }

    Exportacion:
      type: object
      required: [tipoItemExpor]
      description: |
        Lo que hace de una venta una exportación. La tasa es **cero**, y tanto la
        línea como el resumen llevan el tributo C3 con valor 0 — un `null` ahí lo
        rechaza Hacienda con «DEBE PROPORCIONAR UN VALOR».
      properties:
        tipoItemExpor: { type: integer, enum: [1, 2, 3], description: 1 bienes, 2 servicios, 3 ambos. }
        incoterms:
          type: string
          description: |
            **Solo el código** de CAT-031 (`01`..`11`). La descripción la pone el
            servidor desde su copia del catálogo: pedirle a un integrador que
            escriba la redacción del Ministerio es pedirle que la escriba mal.
            Sin incoterm, el código y su descripción salen `null` juntos.
          example: "09"
        recintoFiscal: { type: string, nullable: true, description: "CAT-027; null en exportación de servicios." }
        tipoRegimen: { type: string, nullable: true, description: CAT-033. }
        regimen: { type: string, nullable: true, description: CAT-028. }
        flete:
          type: number
          minimum: 0
          description: Monto pactado, no un cálculo. El servidor lo suma al total de la operación.
        seguro: { type: number, minimum: 0, description: Íd. }

    ReceptorSujetoExcluido:
      type: object
      description: |
        **El VENDEDOR**, no el comprador — el 14 es el único documento del
        catálogo que corre al revés: lo emite quien compra, para documentar una
        compra a alguien que no está en el registro de IVA. Por eso no tiene NRC
        (si lo manda, se ignora: el esquema no tiene dónde ponerlo) y por eso no
        hay IVA en ninguna parte del documento.
      required: [numDocumento, nombre, direccion]
      properties:
        numDocumento:
          type: string
          description: |
            Un DUI se normaliza a `########-#` y un NIT a solo dígitos. El
            Ministerio rechaza en vuelo el otro formato.
        tipoDocumento: { type: string, default: "13", description: "CAT-022; por defecto DUI." }
        nombre: { type: string }
        direccion:
          allOf: [{ $ref: "#/components/schemas/Direccion" }]
          description: 'No es opcional aquí: el esquema de la FSE la declara objeto llano.'
        codActividad: { type: string, nullable: true, description: "CAT-019. Con menos de 5 caracteres sale null, junto con su descripción — no se inventa un código." }
        telefono: { type: string, nullable: true }
        correo: { type: string, format: email, nullable: true }

    Item:
      type: object
      required: [cantidad]
      description: |
        Una línea se describe entera (`descripcion` y `precioUni`) o nombra un
        producto del catálogo con `productId`.

        **`productId` lo resuelve el servidor solo en una llave con «Catálogo
        legible por la API»** (`llave.catalogMode: readable` en `/v1/status`)
        o en cualquier llave de una empresa con el catálogo sin cifrar:
        la descripción, el precio, el código, el tipo y la unidad del producto
        completan lo que la línea omite, y los campos explícitos ganan. Un
        producto que no está en el catálogo publicado, o está inactivo, es
        `404`; si el precio del catálogo tiene una base de IVA distinta a la del
        documento (`vat_included`), es `400` con `reason: catalog_vat_basis` —
        envíe `precioUni` en la base del documento. En una llave con catálogo
        cifrado la API no puede resolverlo: el SDK de TypeScript lo hace en
        local, y una llamada directa debe enviar `descripcion` y `precioUni`.
      anyOf:
        - required: [descripcion, precioUni]
        - required: [productId]
      properties:
        productId:
          type: string
          format: uuid
          description: Producto del catálogo; ver la descripción del esquema.
        descripcion: { type: string, minLength: 1 }
        cantidad:
          type: number
          exclusiveMinimum: 0
          description: |
            Hasta 8 decimales, los que la Normativa admite en el cuerpo. Se
            firma tal cual llega (nada se redondea a dos), y el importe de la
            línea y su IVA salen también con hasta 8 decimales; solo el
            resumen va a dos.
        precioUni:
          type: number
          minimum: 0
          description: |
            Hasta 8 decimales, como `cantidad`.

            **Depende del tipo, y el servidor no adivina.** En una FE (01)
            INCLUYE el IVA. En un CCF (03) y en las notas (05/06) lo EXCLUYE. En
            una exportación (11) no hay IVA que incluir. En una FSE (14) el
            precio es el precio: no se le suma ni se le quita nada. Así lo
            definen los esquemas oficiales.
        codigo: { type: string, nullable: true }
        tipoItem: { type: integer, description: "CAT-011. 1 bien, 2 servicio, 3 ambos, 4 otro.", default: 2 }
        uniMedida: { type: integer, description: "CAT-014. 59 = unidad.", default: 59 }
        tipoVenta:
          type: string
          enum: [gravada, exenta, no_sujeta]
          default: gravada
          description: |
            Cómo trata el IVA a esta línea. **Lo elige usted; Facta no lo
            deduce nunca** de la descripción ni del precio, porque una línea
            mal clasificada es un documento fiscal equivocado.

            · `gravada` (el valor por omisión, y como se ha emitido siempre):
              la línea paga IVA del 13 %.
            · `exenta`: la operación entra en el campo del IVA pero la ley la
              libera (Ley del IVA, arts. 45 y 46). La línea no lleva IVA y va
              a la columna `ventaExenta`. Un caso frecuente son los intereses
              de un préstamo, que **solo** están exentos cuando los cobra un
              banco u otra institución supervisada por la Superintendencia del
              Sistema Financiero, o una cooperativa de ahorro y crédito (art.
              46, letra f). Quien presta sin esa condición cobra IVA: esa
              línea es `gravada`.
            · `no_sujeta`: la operación está fuera del hecho generador del
              impuesto. No lleva IVA y va a la columna `ventaNoSuj`.

            **Qué cambia en el documento.** El IVA se calcula solo sobre las
            líneas gravadas. En una FE (01) el precio ya lo incluye, así que
            una línea exenta o no sujeta se factura por su precio, sin IVA
            dentro. En un CCF (03) y en las notas el precio es neto, y el IVA
            de 13 % se suma solo a lo gravado. Los totales salen separados
            (`totalGravada`, `totalExenta`, `totalNoSuj`) y `montoTotalOperacion`
            suma los tres más el IVA de lo gravado. Un documento con todas sus
            líneas exentas o no sujetas es válido y no lleva IVA.

            **Dónde vale.** 01, 03, 05 y 06. En una nota, use la misma clase
            que tenía la línea del documento que corrige. En el 11 (cuyas
            líneas son siempre de tasa cero) y en el 14 (que documenta una
            compra) el campo se rechaza con `422 validation_failed`, aunque
            diga `gravada`. Un valor que no es uno de los tres es `400`.

            **Con `productId`.** La clase del producto de su catálogo todavía
            no llega a la API: envíe `tipoVenta` en la línea. Sin él, la línea
            se emite como `gravada`.

            **Retención de renta.** `aplicarReteRenta` junto a una línea
            `exenta` o `no_sujeta` se rechaza con
            `422 retention_mixed_class_unsupported`: la base de la retención
            del art. 156 del Código Tributario no depende del IVA, pero para
            ese caso todavía no está confirmada, y Facta prefiere no firmar
            una cifra posiblemente corta.
        numeroDocumento:
          type: string
          nullable: true
          description: |
            En una nota (05/06), a cuál de los `documentosRelacionados`
            pertenece esta línea. Opcional con uno solo; **obligatorio en cuanto
            haya más de uno**, porque si no todas las líneas caerían sobre el
            primero sin decirlo.

    SolicitudDte:
      type: object
      required: [tipoDte, items]
      description: |
        Un solo cuerpo para los seis tipos, y cada tipo exige lo suyo. La tabla
        de quién pide qué:

        | | 01 | 03 | 05 / 06 | 11 | 14 |
        |---|---|---|---|---|---|
        | **precio de la línea** | con IVA | sin IVA | sin IVA | sin IVA (tasa cero) | el precio, tal cual |
        | **receptor** | opcional | inscrito | inscrito | extranjero | el VENDEDOR |
        | **campos propios** | `aplicarRetencionIva` | `aplicarRetencionIva`, `aplicarPercepcionIva` | `documentosRelacionados`, y `numPagoElectronico` solo en 06 | `exportacion` | `aplicarReteRenta` |

        Mandar el campo propio de un tipo en otro es `400`, no un campo
        ignorado en silencio: si alguien manda `aplicarReteRenta` en una
        factura, cree que está reteniendo y no está reteniendo nada.
      properties:
        tipoDte:
          type: string
          enum: ["01", "03", "05", "06", "11", "14"]
          description: |
            `01` factura · `03` crédito fiscal · `05` nota de crédito · `06` nota
            de débito · `11` exportación · `14` sujeto excluido. Los demás del
            catálogo llegan con su tanda.
        entrega:
          $ref: "#/components/schemas/Entrega"
        receptor:
          description: |
            Su forma depende del tipo: `Receptor` para 01/03/05/06,
            `ReceptorExportacion` para el 11 y `ReceptorSujetoExcluido` para el
            14. Una FE (01) puede no llevarlo — es el consumidor final anónimo.
          oneOf:
            - $ref: "#/components/schemas/Receptor"
            - $ref: "#/components/schemas/ReceptorExportacion"
            - $ref: "#/components/schemas/ReceptorSujetoExcluido"
            - type: "null"
        items:
          type: array
          minItems: 1
          maxItems: 2000
          items: { $ref: "#/components/schemas/Item" }
        documentosRelacionados:
          type: array
          minItems: 1
          maxItems: 50
          description: |
            **Obligatorio en 05 y 06, y prohibido en los demás.** Qué documento
            sellado ajusta esta nota. Cada entrada se escribe entera o se nombra
            por su `codigoGeneracion`, que el servidor completa desde el índice
            de SU empresa.
          items: { $ref: "#/components/schemas/DocumentoRelacionado" }
        numPagoElectronico:
          type: string
          maxLength: 100
          nullable: true
          description: Solo en la nota de débito (06). En otro tipo es `400`.
        exportacion:
          allOf: [{ $ref: "#/components/schemas/Exportacion" }]
          description: Obligatorio en el 11, y prohibido en los demás.
        aplicarReteRenta:
          type: boolean
          default: false
          description: |
            Solo en el 14. Retención de renta del 10 % (art. 156 CT) sobre
            servicios de una persona natural. **Nunca automática**: se pide.
            No se puede combinar con líneas `exenta` o `no_sujeta`
            (`422 retention_mixed_class_unsupported`).
        aplicarRetencionIva:
          type: boolean
          default: false
          description: |
            Solo en el 01 y el 03. Retención de IVA del 1 % que practica el
            receptor (art. 162 CT) sobre el monto neto gravado después de
            descuentos. Depende de quién es el comprador, algo que la API no
            puede ver, así que **nunca es automática**: se pide. En otro tipo
            es `400`.
        aplicarPercepcionIva:
          type: boolean
          default: false
          description: |
            Solo en el 03. Percepción de IVA del 1 % (art. 163 CT) sobre el
            monto neto gravado de las líneas de **bienes** (`tipoItem` 1)
            después de la parte proporcional del descuento global; los
            servicios no entran en la base. Se suma al total a pagar
            (`montoTotalOperacion + ivaPerci − ivaRete`) y no forma parte de
            `montoTotalOperacion`. **Nunca es automática**: se pide. En otro
            tipo es `400`.
        condicionOperacion: { type: integer, enum: [1, 2, 3], default: 1, description: 1 contado, 2 crédito, 3 otro. }
        plazo:
          type: string
          enum: ["01", "02", "03"]
          description: CAT-018 — días, meses o años. Solo se escribe si la operación es a crédito.
        periodo:
          type: integer
          minimum: 1
          description: Cuántos de esos plazos. Solo con `condicionOperacion` 2.
        formaPago: { type: string, description: "CAT-017. 01 = efectivo.", example: "01" }
        observaciones: { type: string, nullable: true }
        apendice:
          type: array
          nullable: true
          minItems: 1
          maxItems: 10
          description: |
            La sección **Apéndice** del propio documento: hasta 10 filas
            `campo` / `etiqueta` / `valor` que el esquema oficial admite en los
            seis tipos (01, 03, 05, 06, 11 y 14). **Forma parte del DTE firmado
            y transmitido a Hacienda** —por eso se valida contra el esquema
            antes de gastar un correlativo— y la hoja la imprime como
            «etiqueta: valor» bajo las observaciones. Úselo para lo que sí
            pertenece al documento (orden de compra, vendedor, referencia).
            Si lo que quiere es solo decorar la hoja, use `representacion`.

            Una lista vacía es `400`: omita el campo o mande `null`. Se aplican
            los mínimos más estrictos de los esquemas a todos los tipos
            (`campo` ≥ 2, `etiqueta` ≥ 3) para que una fila válida lo sea en
            cualquiera. Sin saltos de línea ni caracteres de control.
          items: { $ref: "#/components/schemas/FilaApendice" }
          example:
            - { campo: ordenCompra, etiqueta: Orden de compra, valor: OC-2026-0417 }
            - { campo: vendedor, etiqueta: Vendedor, valor: Ana Pérez }
        representacion:
          $ref: "#/components/schemas/Representacion"

    FilaApendice:
      type: object
      required: [campo, etiqueta, valor]
      additionalProperties: false
      properties:
        campo: { type: string, minLength: 2, maxLength: 25, description: Nombre del campo. }
        etiqueta: { type: string, minLength: 3, maxLength: 50, description: Lo que lee la persona. }
        valor: { type: string, minLength: 1, maxLength: 150 }

    Representacion:
      type: object
      additionalProperties: false
      description: |
        Datos **solo de la hoja** (la representación gráfica). Nunca entran al
        JSON firmado ni viajan a Hacienda: existen únicamente para que una
        plantilla los dibuje (mesa y mesero de un restaurante, la placa de un
        taller, los puntos de un programa de lealtad…). Un documento emitido
        con y sin `representacion` produce exactamente los mismos bytes firmados
        (una prueba lo fija), así que no hay cifra fiscal que se pueda colar por
        aquí.

        Se guardan con el índice del documento para que la hoja que se vuelve
        a descargar o a dibujar salga igual. Una plantilla imprime solo los
        bloques cuyos datos llegaron; las plantillas que no declaran una clave
        la ignoran, así que mandarla es seguro y no cambia la hoja. **Solo la API los acepta**: desde la aplicación esos bloques no
        se imprimen.

        Todo texto va en una sola línea, sin caracteres de control. Hasta 20
        valores en total entre las claves conocidas y las `filas`.
        En `prepare` este objeto se rechaza con `400`: se manda en `/v1/dte/sign`
        junto al `prepareToken`.
      properties:
        datos:
          type: object
          additionalProperties: false
          description: Una clave desconocida es `400`; para etiquetas propias use `filas`.
          properties:
            mesa: { type: string, maxLength: 10, example: "12" }
            mesero: { type: string, maxLength: 30, example: Luis }
            comensales: { type: integer, minimum: 1, maximum: 999, example: 4 }
            cajero: { type: string, maxLength: 40 }
            pedido: { type: string, maxLength: 30, example: A-77 }
            bomba: { type: string, maxLength: 20, description: Bomba o surtidor de una gasolinera. }
            placa: { type: string, maxLength: 12, example: P123-456 }
            kilometraje: { type: integer, minimum: 0, maximum: 9999999 }
            tarjetaUltimos4:
              type: string
              pattern: "^[0-9]{4}$"
              description: |
                **Solo los últimos 4 dígitos** de la tarjeta, como texto para
                conservar ceros a la izquierda. Cualquier otra longitud es `400`:
                un número completo de tarjeta nunca debe viajar ni imprimirse.
              example: "0042"
            puntos: { type: integer, minimum: 0, maximum: 999999999, description: Saldo de puntos de lealtad que la hoja muestra., example: 120 }
            propinaSugerida: { type: number, minimum: 0, maximum: 99999.99, description: "Monto en dólares con hasta 2 decimales. Es informativo: nunca se suma al total.", example: 4.5 }
            paciente: { type: string, maxLength: 60, description: "Plantilla Consultorio.", example: Luis Alberto Mena }
            expediente: { type: string, maxLength: 20, description: "Plantilla Consultorio.", example: EXP-4471 }
            proximaCita: { type: string, maxLength: 40, description: "Plantilla Consultorio.", example: 20-10-2026 · 9:00 }
            medico: { type: string, maxLength: 60, description: "Plantilla Consultorio: nombre bajo la línea de firma.", example: Dra. Lucía Hernández }
            registroProfesional: { type: string, maxLength: 20, description: "Plantilla Consultorio: va tras el nombre del médico.", example: JVPM 4821 }
            ordenTrabajo: { type: string, maxLength: 20, description: "Plantilla Angular.", example: OT-2291 }
            entrega: { type: string, maxLength: 60, description: "Plantilla Angular: entrega estimada.", example: 16 de octubre }
            evento: { type: string, maxLength: 60, description: "Plantilla Fluido.", example: Boda Rivas-Menjívar }
            fechaEvento: { type: string, maxLength: 30, description: "Plantilla Fluido.", example: 24 de octubre de 2026 }
            comentario: { type: string, maxLength: 60, description: "Plantilla Restaurante.", example: Sin picante }
            proyecto: { type: string, maxLength: 60, description: "Plantilla Cubos.", example: Residencial Las Palmeras }
            entregable: { type: string, maxLength: 40, description: "Plantilla Cubos.", example: Planos aprobados }
            periodo: { type: string, maxLength: 40, description: "Plantilla Estado de cuenta: período que cubre el servicio (se imprime como «Período: …»).", example: del 1 al 31 de agosto de 2026 }
            secciones:
              type: string
              maxLength: 400
              description: |
                Plantilla Por secciones. Un DTE no tiene secciones; con esta clave
                la tabla se agrupa. Formato `Nombre:desde-hasta` separado por `;`
                sobre el Nº de cada línea, sin huecos desde el 1 (hasta 12
                secciones; nombre de 1 a 40 caracteres sin `:` ni `;`). Si los
                rangos no cubren exactamente las líneas del documento, la hoja
                sale como una sola lista.
              example: "Alimentos:1-3;Bebidas:4-6;Servicio:7-9"
            filas:
              type: array
              maxItems: 10
              description: |
                Filas libres «etiqueta: valor». La etiqueta no puede imitar un
                campo fiscal del documento (`Total a pagar`, `IVA`, `Sello`,
                `NIT`…): sobre el papel se leería como una cifra que el
                documento no lleva.
              items:
                type: object
                required: [etiqueta, valor]
                additionalProperties: false
                properties:
                  etiqueta: { type: string, maxLength: 30, example: Zona }
                  valor: { type: string, maxLength: 80, example: Terraza }
        plantilla:
          type: object
          additionalProperties: false
          description: |
            La plantilla con la que se dibujan **este** documento (la carta o
            PDF) y su ticket. Solo Lite y Pro pueden elegir las plantillas
            pagadas; el plan siempre se lee de la empresa emisora, nunca de la
            petición.

            Cada valor es el id de una plantilla del catálogo (por ejemplo
            `letter-institucional`, `ticket-aireado`) o `custom:<uuid>` de una
            plantilla propia **publicada** de la empresa emisora (se usa su
            versión vigente al emitir).

            **Pedir una plantilla que no se puede aplicar no es un error.** El
            documento se emite igual con la plantilla de la empresa y la
            respuesta trae una advertencia `plantilla_no_aplicada` por cada
            campo no atendido, con el `motivo`: `plan` (su plan no la incluye),
            `no_existe` (no existe, no es de su empresa o no está publicada) o
            `incompatible` (es de otro tipo de hoja, o ese tipo de documento no
            tiene ticket). Un valor mal formado (no es texto, más de 64
            caracteres, una forma que no es un id) sí es `400`.

            La plantilla aplicada se guarda cifrada junto a `datos`: la
            descarga posterior (`GET /v1/dte/{codigoGeneracion}/file?kind=pdf`
            o `kind=ticket`), el correo, WhatsApp y el redibujado usan la misma
            plantilla, también si la plantilla propia se vuelve a publicar
            después. Los `datos` llegan al ticket cuando su plantilla los
            declara. Sin `plantilla`, todo sigue como antes: la plantilla de la
            empresa.
          properties:
            carta:
              type: string
              maxLength: 64
              description: Plantilla de la carta (PDF).
              example: letter-institucional
            ticket:
              type: string
              maxLength: 64
              description: Plantilla del ticket de 80 mm.
              example: ticket-aireado
      example:
        datos:
          mesa: "12"
          mesero: Luis
          comensales: 4
          tarjetaUltimos4: "0042"
          puntos: 120
          filas:
            - { etiqueta: Zona, valor: Terraza }

    SolicitudFirma:
      type: object
      required: [prepareToken, documento]
      properties:
        prepareToken: { type: string, description: Tal cual lo devolvió `prepare`. Vence a los 15 min. }
        documento: { type: object, description: El documento canónico de `prepare`, sin tocar un centavo. }
        representacion:
          $ref: "#/components/schemas/Representacion"

    PersonaDeLaAnulacion:
      type: object
      required: [nombre, numDocumento]
      properties:
        nombre: { type: string }
        numDocumento:
          type: string
          description: |
            Sin guiones. Un NIT son 14 dígitos (o 9, si está homologado con el
            DUI) y un DUI son 9 dígitos: la Normativa 2.0 lo valida así y el
            ambiente de pruebas rechaza `05308546-5` desde el 16-sep-2026. Si
            manda el guion se lo quitamos antes de firmar, según el tipo.
          example: "012345678"
        tipoDocumento:
          type: string
          description: |
            CAT-022 — 36 NIT, 13 DUI, 03 pasaporte, 02 carné de residente, 37
            otro. **Mándelo siempre.** El tipo se elige junto al número, donde
            alguien lo escribe, y viaja con él; no es algo que se pueda leer de
            la forma del número, porque nueve dígitos son a la vez un DUI y un
            NIT homologado con ese DUI, y la misma persona puede ser cualquiera
            de los dos.

            Si lo omite lo deducimos, y es solo una red: 14 dígitos es NIT (36),
            9 dígitos o `########-#` es DUI (13) —porque aquí se nombran
            PERSONAS— y cualquier otra cosa es «otro» (37). Una deducción
            equivocada no la atrapa el esquema; la atrapa el Ministerio, en
            vuelo, y entonces el evento ya gastó su intento.
          example: "13"

    SolicitudAnulacion:
      type: object
      required: [tipoAnulacion, responsable, solicita]
      properties:
        tipoAnulacion:
          type: integer
          enum: [1, 2, 3]
          description: 1 error en el documento, 2 rescisión, 3 otro.
        motivo:
          type: string
          nullable: true
          description: Obligatorio en los tipos 1 y 3; el campo 111 describe el error.
        codigoGeneracionReemplazo:
          type: string
          format: uuid
          nullable: true
          description: |
            El documento que reemplaza al anulado. Obligatorio en los tipos 1 y
            3, y prohibido en el 2.
        responsable:
          allOf: [{ $ref: "#/components/schemas/PersonaDeLaAnulacion" }]
          description: Quien responde por la anulación ante Hacienda.
        solicita:
          allOf: [{ $ref: "#/components/schemas/PersonaDeLaAnulacion" }]
          description: Quien la pidió. Puede ser la misma persona.

    DteAnulado:
      type: object
      properties:
        estado: { type: string, const: invalidado }
        codigoGeneracion: { type: string, format: uuid, description: El del documento anulado. }
        numeroControl: { type: string }
        tipoDte: { type: string }
        ambiente: { type: string }
        yaEstabaInvalidado:
          type: boolean
          description: Presente y `true` cuando el documento ya estaba anulado y no se mandó nada.
        evento:
          type: object
          description: El documento de anulación, que es un documento aparte.
          properties:
            codigoGeneracion: { type: string, format: uuid }
            selloRecibido: { type: string, description: La prueba de que quedó anulado. }
            fhProcesamiento: { type: string }
            observaciones: { type: array, items: { type: string } }
            tipoAnulacion: { type: integer, enum: [1, 2, 3] }
        documento: { type: object, description: El evento canónico, tal como se firmó. }
        jws: { type: string, description: El evento firmado. Archívelo como archiva el DTE. }
        anotadoEnElIndice:
          type: boolean
          description: |
            Si además pudimos anotarlo en nuestro libro. `false` no cambia que el
            documento está anulado —el sello de Hacienda es lo que manda— pero
            merece una mirada en la bitácora de peticiones.

    SolicitudRetorno:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 2000
          description: Una entrada por línea (y forma) que regresa. La misma línea no se repite con la misma forma.
          items: { $ref: "#/components/schemas/ItemRetorno" }
        fechaEvento:
          type: string
          format: date
          description: |
            AAAA-MM-DD. La fecha en que el evento se aplica al documento; por
            defecto hoy en El Salvador. Tiene que caer dentro del plazo de
            evento de retorno (`return_window_closed`).

    ItemRetorno:
      type: object
      required: [linea]
      description: Lleva `cantidad` o `noGravado`, una sola.
      properties:
        linea:
          type: integer
          minimum: 1
          description: La línea del documento original, **contada desde 1**.
        cantidad:
          type: number
          exclusiveMinimum: 0
          description: Unidades que regresan. No puede pasar de `disponible`.
        noGravado:
          type: number
          description: |
            Cargo (positivo) o abono (negativo) que no afecta la base
            imponible. Distinto de cero, con el mismo signo que el de la línea
            original, y sin pasar de su valor.

    Disponible:
      type: object
      description: Lo que queda por devolver de una línea del documento.
      required: [linea, vendida, devuelta, disponible]
      properties:
        linea: { type: integer, minimum: 1 }
        vendida: { type: number, description: Unidades que vendió la línea. }
        devuelta: { type: number, description: Unidades que los eventos de retorno firmados o sellados ya se llevaron. }
        disponible: { type: number, description: Lo que todavía puede regresar. }
        noGravado:
          type: object
          nullable: true
          description: El cargo o abono de la línea, o `null` si no lleva.
          properties:
            vendido: { type: number }
            devuelto: { type: number }
            disponible: { type: number }

    RetornoSellado:
      type: object
      required: [estado, codigoGeneracion, selloRecibido, totales, jws, archivoJson, disponible]
      properties:
        estado: { type: string, const: sellado }
        codigoGeneracion: { type: string, format: uuid, description: El del EVENTO de retorno, no el del documento. }
        documentoRelacionado:
          type: object
          description: El documento al que se aplicó.
          properties:
            codigoGeneracion: { type: string, format: uuid }
            numeroControl: { type: string }
            tipoDte: { type: string, enum: ["01", "11", "14"] }
            fecEmi: { type: string, format: date }
        ambiente: { type: string, enum: ["00", "01"] }
        fecEmi: { type: string, format: date, description: La fecha del evento. }
        horEmi: { type: string }
        selloRecibido: { type: string, description: La prueba de que Hacienda registró el evento de retorno. }
        fhProcesamiento: { type: string, nullable: true }
        observaciones: { type: array, items: { type: string } }
        totales:
          type: object
          description: Lo que sale en este evento, no lo acumulado.
          properties:
            totalGravada: { type: number }
            totalExenta: { type: number }
            totalNoSuj: { type: number }
            totalIva: { type: number }
            totalPagar: { type: number }
        documento: { type: object, description: El evento canónico, tal como se firmó. }
        jws: { type: string, description: El evento firmado. }
        archivoJson:
          type: string
          description: Los bytes exactos del JSON del evento, para guardarlos tal cual en su almacenamiento.
        representacionGrafica:
          type: string
          nullable: true
          description: PDF carta en base64, o `null` si no se pudo dibujar (el JSON es el artefacto fiscal).
        disponible:
          type: array
          description: Lo que queda por devolver de cada línea del documento, ya contando este evento de retorno.
          items: { $ref: "#/components/schemas/Disponible" }
        almacenamiento: { type: string, enum: [retencion, ninguno] }
        storage: { type: object, description: El recibo del almacenamiento administrado, como el de la emisión. }
        anotadoEnElLibro:
          type: boolean
          description: |
            Si además pudimos anotar el veredicto en nuestro libro. `false` no
            cambia que Hacienda registró el evento de retorno; el siguiente reintento
            con la misma `Idempotency-Key` lo asienta.

    RetornoPendiente:
      type: object
      description: |
        El evento está firmado y registrado, pero Hacienda no contestó. Es la
        misma estructura que `RetornoSellado`, sin sello.
      required: [estado, codigoGeneracion, jws, detalle]
      properties:
        estado: { type: string, const: firmado }
        codigoGeneracion: { type: string, format: uuid }
        documentoRelacionado: { type: object }
        ambiente: { type: string }
        fecEmi: { type: string, format: date }
        horEmi: { type: string }
        totales: { type: object }
        documento: { type: object }
        jws: { type: string, description: Lo que se reenvía en el reintento. }
        archivoJson: { type: string }
        disponible:
          type: array
          items: { $ref: "#/components/schemas/Disponible" }
        detalle: { type: string, description: Por qué no llegó. }
        almacenamiento: { type: string, enum: [retencion, ninguno] }

    RetornoResumen:
      type: object
      description: Un evento de retorno registrado sobre un documento, en `retornos` de `GET /v1/dte/{codigoGeneracion}`.
      properties:
        codigoGeneracion: { type: string, format: uuid }
        estado: { type: string, enum: [firmado, sellado, rechazado, abandonado] }
        fecha: { type: string, format: date }
        selloRecibido: { type: string, nullable: true }
        totales:
          type: object
          properties:
            totalGravada: { type: number }
            totalIva: { type: number }
            totalPagar: { type: number }
        lineas:
          type: array
          items:
            type: object
            required: [linea]
            properties:
              linea: { type: integer, minimum: 1 }
              cantidad: { type: number, description: Unidades devueltas de esa línea. }
              noGravado: { type: number, description: Cargo o abono devuelto de esa línea. Una línea puede traer las dos cosas. }

    Totales:
      type: object
      description: |
        Los calcula `dte-core` en el servidor. **El cliente los transporta y no
        los recalcula nunca.**

        `totalIva` es el IVA de verdad, venga de donde venga: una FE lo lleva en
        `resumen.totalIva` y un CCF lo desglosa en `resumen.tributos` código 20
        dejando aquel campo vacío. Leer un solo sitio acierta la mitad de las
        veces, y la mitad en la que falla es cada crédito fiscal.
      properties:
        totalNoSuj: { type: number }
        totalExenta: { type: number }
        totalGravada: { type: number }
        totalDescu: { type: number }
        totalIva: { type: number }
        montoTotalOperacion: { type: number }
        totalPagar: { type: number }
        totalLetras: { type: string, example: VEINTIOCHO 25/100 DOLARES }

    DteSellado:
      type: object
      required: [estado, codigoGeneracion, numeroControl, selloRecibido, documento, jws, archivoJson]
      properties:
        estado: { type: string, const: sellado }
        codigoGeneracion: { type: string, format: uuid }
        numeroControl: { type: string, example: DTE-03-M001P001-000000000000175 }
        tipoDte: { type: string }
        ambiente: { type: string, enum: ["00", "01"], description: El de la llave y su empresa, que son el mismo. }
        fecEmi: { type: string, format: date }
        horEmi: { type: string, example: "15:59:27" }
        selloRecibido: { type: string, description: La prueba. Sin sello no hay documento, aunque el MH diga PROCESADO. }
        fhProcesamiento: { type: string }
        observaciones: { type: array, items: { type: string }, description: Un sello CON observaciones sigue siendo un sello, pero conviene leerlas. }
        totales: { $ref: "#/components/schemas/Totales" }
        documento: { type: object, description: El DTE canónico, tal como se firmó. }
        jws:
          type: string
          description: |
            El JWS compacto RS512. **Es esto lo que hay que archivar**: volver a
            serializar `documento` no reproduce los bytes cuya firma Hacienda
            validó.
        archivoJson:
          type: string
          description: |
            Contenido UTF-8 exacto del archivo JSON que devuelve la descarga de
            esta factura. El servidor lo genera desde el mismo JWS y lo incluye
            aquí para que el cliente lo archive sin reconstruirlo ni volver a
            descargarlo. Guarde esta cadena directamente como archivo `.json`.
        archivoDte:
          type: string
          description: |
            El **Archivo DTE** como lo lee el receptor —el documento más
            `firmaElectronica` y `selloRecibido`— en su texto UTF-8 exacto. Es
            el mismo texto que entrega `GET /v1/dte/{codigoGeneracion}/file?kind=json`
            por defecto y el mismo archivo que va adjunto al correo. Úselo para
            mostrar o entregar el documento; `archivoJson` sigue siendo el JSON
            guardado `{codigoGeneracion, ambiente, jws}`. Ausente en contingencia
            (no hay sello todavía).
        representacionGrafica:
          type: string
          format: byte
          nullable: true
          description: |
            El PDF del documento, en base64 — la misma hoja que imprime la app,
            del catálogo de 20 plantillas de `@facta/rg`. Lleva el sello y el
            QR, así que solo existe DESPUÉS de que el MH conteste.

            La plantilla, la franja del plan gratuito y el logo salen de la
            empresa EMISORA; no se piden en la petición.

            `null` no es un error: el artefacto fiscal es el `jws` y el sello ya
            está dado. Un PDF que no se pudo dibujar no invalida una emisión que
            sí ocurrió.
        storage:
          $ref: "#/components/schemas/ManagedStorageReceipt"
        almacenamiento:
          type: string
          enum: [retencion, ninguno, pendiente]
          description: |
            Si además del documento que lleva en esta respuesta quedó una copia
            en el área de retención (`retencion`) o no (`ninguno`). `pendiente`
            solo aparece con `X-Facta-Copies: deferred`: la copia se escribe
            después de responder. El
            almacenamiento nunca bloquea el sello: un fallo aquí no cambia que
            el documento está sellado. Con la política de retención `fallback`
            la copia de retención es solo de emergencia: si el almacenamiento
            administrado confirmó el archivo, aquí vendrá `ninguno` y `storage`
            dirá `stored`; es lo normal, el archivo se descarga igual. Con
            `sin_almacenamiento_duradero` aparece `retencion` (la copia temporal);
            con `sin_copia_en_servidor`, `ninguno`.
        advertencias:
          type: array
          description: |
            Solo aparece cuando un archivo está en riesgo; su ausencia es la
            normalidad. Cada elemento trae `codigo` y `mensaje` (en español, de
            usted). Un reintento con la misma `Idempotency-Key` devuelve las
            mismas advertencias.

            · `copia_solo_temporal`: no se pudo guardar en el almacenamiento
            administrado; el archivo solo está en la copia temporal (una hora).
            Descárguelo cuanto antes. Solo con la política de retención `fallback`.

            · `sin_almacenamiento_duradero`: la empresa no tiene ningún
            almacenamiento disponible (sin destino verificado, destinos
            quitados o almacenamiento administrado no disponible). El documento
            está sellado y **solo existe en la copia temporal** (una hora).
            Guárdelo ya: el SDK lo hace con su mecanismo de emergencia. En este
            caso la copia temporal se escribe SIEMPRE antes de responder, aun
            con `X-Facta-Copies: deferred`.

            · `sin_copia_en_servidor` (**crítica**): el documento está sellado
            pero no se pudo guardar en ningún lugar del servidor. Esta respuesta
            (`jws`, `archivoJson`, `representacionGrafica`) es el único
            ejemplar seguro: guárdelo ahora. El documento está indexado y se
            puede volver a descargar (se rearma desde el archivo), y el barrido
            de reparación reintenta la copia administrada.

            · `plantilla_no_aplicada`: `representacion.plantilla` pidió una
            plantilla que no se pudo usar. El documento se emitió con la
            plantilla de la empresa. Trae además `campo`
            (`representacion.plantilla.carta` o `.ticket`) y `motivo`
            (`plan`, `no_existe` o `incompatible`). No indica ningún riesgo
            para los archivos.
          items:
            type: object
            required: [codigo, mensaje]
            properties:
              codigo: { type: string, enum: [copia_solo_temporal, sin_almacenamiento_duradero, sin_copia_en_servidor, plantilla_no_aplicada] }
              mensaje: { type: string }
              campo: { type: string, description: "Solo `plantilla_no_aplicada`: el campo de la petición no atendido.", example: representacion.plantilla.ticket }
              motivo: { type: string, enum: [plan, no_existe, incompatible], description: "Solo `plantilla_no_aplicada`: por qué no se aplicó." }
        entrega:
          $ref: "#/components/schemas/EntregaMarcada"

    DteEnContingencia:
      type: object
      description: |
        Firmado y sin respuesta del MH. Lleva los mismos campos que el sellado
        salvo los que solo existen con sello: no hay `selloRecibido`, no hay
        `fhProcesamiento` y no hay `representacionGrafica` — la hoja necesita el
        sello y el QR, así que todavía no se puede dibujar.
      properties:
        estado: { type: string, const: contingencia }
        codigoGeneracion: { type: string, format: uuid }
        numeroControl: { type: string }
        tipoDte: { type: string }
        ambiente: { type: string }
        fecEmi: { type: string, format: date }
        horEmi: { type: string }
        detalle: { type: string, description: Por qué no se alcanzó al MH. }
        documento: { type: object }
        jws: { type: string }
        archivoJson:
          type: string
          description: |
            Contenido UTF-8 exacto del JSON firmado que debe conservarse
            mientras la transmisión queda en contingencia. El servidor lo
            genera desde el mismo JWS que se firmó.
        almacenamiento:
          type: string
          enum: [retencion, ninguno]
          description: |
            Si quedó copia en el área de retención. La red es la misma que en el
            sellado, y aquí importa más: es el único sitio, aparte de esta
            respuesta, donde existe el documento firmado mientras Hacienda no
            conteste.
        entrega:
          $ref: "#/components/schemas/EntregaMarcada"

    DtePreparado:
      type: object
      properties:
        estado: { type: string, const: preparado }
        codigoGeneracion: { type: string, format: uuid }
        numeroControl: { type: string }
        tipoDte: { type: string }
        ambiente: { type: string }
        totales: { $ref: "#/components/schemas/Totales" }
        documento: { type: object }
        prepareToken: { type: string }

    DteConsultado:
      type: object
      properties:
        estado:
          type: string
          description: Un solo vocabulario, en español, responda el índice o la reserva.
          enum: [sellado, firmado, rechazado, contingencia, invalidado, reservado, liberado, descartado]
        codigoGeneracion: { type: string, format: uuid }
        numeroControl: { type: string }
        tipoDte: { type: string }
        ambiente: { type: string }
        fecEmi: { type: string, format: date }
        horEmi: { type: string, nullable: true }
        selloRecibido: { type: string, nullable: true }
        observaciones: { type: array, items: { type: string } }
        motivo: { description: Las palabras del MH cuando el documento fue rechazado., nullable: true }
        totales:
          type: object
          description: |
            Del documento sellado salen `totalGravada`, `totalIva` y
            `totalPagar`. De uno **rechazado** —que no tiene fila de índice, y
            se contesta desde su reserva— sale solo `totalPagar`, y tampoco hay
            `horEmi`, `observaciones` ni `receptor`.
        receptor:
          type: object
          nullable: true
          description: Receiver metadata from the historical document. Company-vault-encrypted app/import metadata is unavailable to API keys and is returned as null fields; it is never reconstructed from the current catalog.
          properties:
            nombre: { type: string, nullable: true }
        retornos:
          type: array
          description: |
            Solo en facturas (01), de exportación (11) y de sujeto excluido (14):
            los eventos de retorno registrados sobre el documento, las más recientes
            primero. Las rechazadas (`rechazado`) y las abandonadas (`abandonado`) aparecen y no restan.
          items: { $ref: "#/components/schemas/RetornoResumen" }
        disponible:
          type: array
          nullable: true
          description: |
            Solo en 01, 11 y 14: lo que queda por devolver de cada línea. `null`
            cuando esta API no tiene el JSON firmado del documento (los que se
            emitieron desde la app) o el documento no está vigente. Consultar
            por el código de un EVENTO de retorno contesta su estado y su sello,
            con `tipoDte: "18"`.
          items: { $ref: "#/components/schemas/Disponible" }

    PaginaDeDocumentos:
      type: object
      required: [documentos, siguiente]
      properties:
        documentos:
          type: array
          items: { $ref: "#/components/schemas/DteEnLista" }
        siguiente:
          type: string
          nullable: true
          description: |
            El cursor de la página siguiente, o `null` cuando no hay más. Opaco:
            páselo tal cual en `?cursor=`. Nunca una cadena vacía — un cliente
            la pediría igual.

    DteEnLista:
      type: object
      description: |
        Lo que hace falta para reconciliar: qué número, qué estado, cuánto y a
        quién. El documento entero se pide por su código con
        `GET /v1/dte/{codigoGeneracion}` o `…/file`.
      properties:
        estado:
          type: string
          enum: [sellado, firmado, contingencia, invalidado, rechazado]
        codigoGeneracion: { type: string, format: uuid }
        numeroControl: { type: string }
        tipoDte: { type: string }
        fecEmi: { type: string, format: date }
        horEmi: { type: string }
        selloRecibido: { type: string, nullable: true }
        totales:
          type: object
          properties:
            totalGravada: { type: number }
            totalIva: { type: number }
            totalPagar: { type: number }
        receptor:
          type: object
          description: Historical receiver metadata. Null fields mean private company-vault data is unavailable to the API; current catalog data is not a replacement.
          properties:
            nombre: { type: string, nullable: true }
            numDocumento: { type: string, nullable: true }
        archivoDte:
          type: string
          description: Solo con `include=dte`. El Archivo DTE, el mismo texto de `…/file?kind=json`.
        dteError:
          type: object
          description: Solo con `include=dte`, en lugar de `archivoDte`, cuando el servidor no pudo entregar el JSON de esta fila.
          required: [code, message]
          properties:
            code:
              type: string
              description: "`not_sealed`, `storage_unavailable`, `not_found`, `timeout` o `needs_local_decrypt`."
            message: { type: string }
            destinos:
              type: array
              description: Solo con `needs_local_decrypt`. Las copias del libro donde el SDK puede leer el documento.
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  rutaJson: { type: string }
                  verificada: { type: boolean }

    DocumentoRetenido:
      type: object
      description: |
        Una fila del área de retención — evidencia de estado, nunca una ruta
        de bucket ni contenido.
      properties:
        codigoGeneracion: { type: string, format: uuid }
        ambiente: { type: string, enum: ["00", "01"] }
        whereLanded:
          type: string
          enum: [holding, synced]
          description: '"holding": solo existe aquí. "synced": ya confirmaste que aterrizó en tu destino real.'
        gaveUp: { type: boolean, description: Se agotaron los tres intentos del barrido de cinco minutos. }
        attempts: { type: integer }
        expiresAt: { type: string, format: date-time, description: Una hora después de firmado. }
        downloadedAt: { type: string, format: date-time, nullable: true }
        downloadCount: { type: integer, description: Evidencia, no un cupo — descargar dos veces no se niega. }
        syncedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    ManagedStorageArtifactReceipt:
      type: object
      required: [state, sha256, bytes, storedAt, errorCode, retryable]
      properties:
        state: { type: string, enum: [stored, pending, failed, not_configured, unsupported] }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$", nullable: true }
        bytes: { type: integer, minimum: 0, nullable: true }
        storedAt: { type: string, format: date-time, nullable: true }
        errorCode: { type: string, nullable: true, description: Código estable y sanitizado; nunca texto bruto del Worker. }
        retryable: { type: boolean }

    ManagedStorageReceipt:
      type: object
      required: [destination, environment, json, pdf, operationId]
      properties:
        destination: { type: string, enum: [managed, none] }
        environment: { type: string, enum: ["00", "01"] }
        json: { $ref: "#/components/schemas/ManagedStorageArtifactReceipt" }
        pdf: { $ref: "#/components/schemas/ManagedStorageArtifactReceipt" }
        operationId: { type: string, format: uuid }

    PlantillasDisponibles:
      type: object
      required: [plantillas, predeterminada]
      properties:
        plantillas:
          type: array
          items:
            type: object
            required: [id, tipo, nombre, origen, permitida, clavesDatos]
            properties:
              id: { type: string, description: "El valor para `representacion.plantilla.carta` / `.ticket`.", example: letter-institucional }
              tipo: { type: string, enum: [carta, ticket] }
              nombre: { type: string, example: "H · Institucional" }
              origen: { type: string, enum: [catalogo, propia], description: "`propia` es una plantilla publicada de la empresa (`custom:<uuid>`)." }
              permitida: { type: boolean, description: "Si la empresa puede usarla ahora (plan vigente y, con `tipoDte`, ese tipo de documento)." }
              motivo: { type: string, enum: [plan, incompatible], description: "Solo cuando `permitida` es `false`." }
              tiposDte:
                type: array
                description: Solo si la plantilla no sirve para todos los tipos que emite la API.
                items: { type: string }
              clavesDatos:
                type: array
                description: Claves de `representacion.datos` que la plantilla imprime.
                items: { type: string }
        predeterminada:
          type: object
          required: [carta, ticket]
          description: La elección actual de la empresa, la que se usa si la petición no pide plantilla.
          properties:
            carta: { type: string, example: letter-clasica }
            ticket: { type: string, example: ticket-clasico }

    ManagedStorageStatus:
      type: object
      required: [capabilityVersion, managed, byos, supportedKinds, unsupportedKinds]
      properties:
        capabilityVersion: { type: integer, const: 1 }
        capabilities:
          type: object
          description: Funciones opcionales de este servidor; ausente en servidores anteriores.
          properties:
            byosCopyReport: { type: integer, description: "Versión de `POST /v1/storage/copies/{codigoGeneracion}/byos`." }
        managed:
          type: object
          required: [configured, ready, state, integration, quotaBytes, usedBytes, reservedBytes, usedBytesTotal, reservedBytesTotal, coveredUntil, accessUntil, bucketState, backupState]
          properties:
            configured: { type: boolean }
            ready: { type: boolean }
            state: { type: string, description: Estado de cobertura/cupo/bucket; no es un compromiso de respaldo. }
            integration: { type: string, enum: [ready, unavailable] }
            quotaBytes: { type: integer, nullable: true }
            usedBytes: { type: integer, nullable: true }
            reservedBytes: { type: integer, nullable: true }
            usedBytesTotal: { type: integer, nullable: true }
            reservedBytesTotal: { type: integer, nullable: true }
            coveredUntil: { type: string, format: date-time, nullable: true }
            accessUntil: { type: string, format: date-time, nullable: true }
            bucketState: { type: string, nullable: true }
            backupState: { type: string, nullable: true, description: Estado informado; no demuestra que un respaldo esté verificado. }
        byos:
          type: object
          required: [ready]
          properties:
            ready: { type: boolean }
        supportedKinds: { type: array, items: { type: string, enum: [json, pdf] } }
        unsupportedKinds: { type: array, items: { type: string, enum: [ticket, invalidation] } }

    ManagedDocumentCopy:
      type: object
      required: [generationCode, kind, environment, state, bytes, sha256, issuedDate, storedAt]
      properties:
        generationCode: { type: string, format: uuid }
        kind: { type: string, enum: [json, pdf] }
        environment: { type: string, enum: ["00", "01"] }
        state: { type: string, enum: [stored, pending, failed] }
        bytes: { type: integer, minimum: 0 }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        issuedDate: { type: string, format: date }
        storedAt: { type: string, format: date-time, nullable: true }

    ManagedDocumentCopies:
      type: object
      required: [capabilityVersion, copies]
      properties:
        capabilityVersion: { type: integer, const: 1 }
        copies: { type: array, maxItems: 500, items: { $ref: "#/components/schemas/ManagedDocumentCopy" } }

    Status:
      type: object
      properties:
        ok: { type: boolean }
        version: { type: string, const: v1 }
        region:
          type: string
          nullable: true
          example: us-west-2
          description: |
            La región de la base de datos de este ambiente (por ejemplo
            `us-west-2`). Supabase ejecuta cada función en la región más
            cercana a quien llama, y desde fuera de la región de la base cada
            consulta cruza el continente: una Factura de $1 tardó 7,2 s sin
            fijarla y 4,3 s con ella. **Un integrador por HTTP directo debe
            enviar `x-region: <region>` en cada petición** (o el parámetro
            `forceFunctionRegion=<region>`); el SDK lo lee aquí una vez al
            iniciar y lo envía solo. `null` en un servidor sin región
            configurada: no envíe nada.
        servedRegion:
          type: string
          nullable: true
          example: us-west-2
          description: |
            La región en la que se atendió ESTA petición, según el entorno de
            ejecución. Si difiere de `region`, la petición no llevó `x-region`.
            Informativo; también llega en la cabecera de respuesta
            `x-sb-edge-region`.
        ambiente:
          type: string
          enum: ["00", "01"]
          description: |
            El de la LLAVE. `/v1/status` es la única ruta que no exige ambiente
            de pruebas, así que una llave `facta_live_` puede contestar `01`
            aquí y ser rechazada en cuanto intente emitir.
        emisor:
          type: object
          nullable: true
          properties:
            nit: { type: string }
            nombre: { type: string }
            ambiente: { type: string }
        llave:
          type: object
          properties:
            keyId: { type: string }
            label: { type: string, nullable: true }
            modo: { type: string, enum: [custodian, byok] }
            alcances: { type: array, items: { type: string, enum: [issue, query, download, "entrega:correo", "entrega:whatsapp", "catalog:read", "catalog:write"] } }
            tiposDte: { type: array, items: { type: string } }
            venceEl: { type: string, format: date-time, nullable: true }
            catalogMode:
              type: string
              enum: [encrypted, readable]
              description: |
                `readable`: el servidor resuelve `customerId` y `productId` desde
                un catálogo en claro (clientes y productos solamente) que el
                dueño eligió publicar para esta llave. `encrypted`: el catálogo
                solo lo abre el SDK; también es la respuesta de un servidor
                anterior a esta opción. También es `readable` para toda llave de
                una empresa con el catálogo sin cifrar (`catalogoSinCifrar`).
            catalogoSinCifrar:
              type: boolean
              description: |
                `true` cuando la empresa guarda su catálogo sin cifrar y el
                servidor resuelve `customerId` y `productId` desde las tablas,
                para cualquier llave. Es una opción de la empresa, no de la llave.
            catalogoEscritura:
              type: boolean
              description: |
                `true` cuando el dueño permitió administrar clientes y productos
                desde el API (Cuenta → API). Escribir además exige el alcance
                `catalog:write` en `alcances`; sin lo uno o sin lo otro, las
                rutas de escritura contestan `403`.
        catalogoLegible:
          type: object
          nullable: true
          description: "Solo con catalogMode readable; frescura del catálogo publicado."
          properties:
            publicado: { type: boolean }
            revisionPublicada: { type: integer, nullable: true }
            revisionActual: { type: integer }
        firma:
          type: object
          description: |
            Si esta llave puede firmar y con qué origen. El vault de firma
            sigue siendo ilegible por la API de consulta. `certificado` solo
            expone datos públicos previamente registrados junto a la clave
            pública: huella, vigencia, NIT y ambiente. No devuelve ciphertext,
            credenciales, llave privada ni el contenido del certificado.
          properties:
            vaultDeFirma:
              type: boolean
              description: La llave tiene su propio vault con el certificado del emisor.
            origenDeLaFirma:
              type: string
              enum: [vault, plataforma, sin-provisionar]
              description: |
                `vault`: el certificado del emisor, abierto con
                `X-Facta-Sign-Key`. `plataforma`: llave anterior al diseño de
                los dos vaults, que todavía firma con el certificado de Facta —
                camino con fecha de retiro. `sin-provisionar`: no puede firmar.
            cabecera:
              type: string
              const: x-facta-sign-key
            certificado:
              type: object
              nullable: true
              description: Metadatos públicos del certificado que coincide con la huella del vault de firma. `environment` indica el slot en el que se registró la clave pública; es informativo.
              properties:
                fingerprint: { type: string, nullable: true }
                validFrom: { type: string, format: date-time, nullable: true }
                validTo: { type: string, format: date-time, nullable: true }
                nit: { type: string, nullable: true }
                environment: { type: string, enum: ["00", "01"], nullable: true }
        sincronizacion:
          type: object
          nullable: true
          description: |
            Revisions desired by the company and published to this key. A
            `legacy` domain keeps its pre-sync behavior until the owner enrolls
            the key from the app. Catalog freshness is needed when the SDK
            resolves customer or product IDs; complete inline data is independent.
          properties:
            environment: { type: string, enum: ["00", "01"] }
            sign: { $ref: "#/components/schemas/SyncRevision" }
            destinations: { $ref: "#/components/schemas/SyncRevision" }
            catalog: { $ref: "#/components/schemas/SyncRevision" }
        limites:
          type: object
          description: |
            Los techos se cuentan ANTES de trabajar, con el patrón de
            `email_relay_log`: una petición que muere a medio camino igual gastó
            su cupo. Es conservador a propósito — con trabajo irreversible al
            otro lado de la puerta, el que pierde un turno es el integrador
            honesto, no el ladrón.
          properties:
            hora: { $ref: "#/components/schemas/Ventana" }
            dia: { $ref: "#/components/schemas/Ventana" }
            estado:
              allOf: [{ $ref: "#/components/schemas/Ventana" }]
              description: |
                La ventana propia de `/v1/status`, contada aparte de las dos de
                arriba. Preguntar por el estado ya no gasta el techo de emitir
                — que era justo lo que hacía que un monitor cada minuto se
                comiera la hora entera.
            montoMaximoPorDocumentoCentavos: { type: integer }

    Ventana:
      type: object
      nullable: true
      properties:
        limit: { type: integer }
        used: { type: integer }
        remaining: { type: integer }

    SyncRevision:
      type: object
      properties:
        desiredRevision: { type: integer }
        publishedRevision: { type: integer, nullable: true }
        status: { type: string, enum: [legacy, ready, pending, error] }

    Cliente:
      type: object
      required: [id, nombre, activo]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        tipoDocumento: { type: string, nullable: true, example: "13", description: "CAT-022: 36 NIT, 13 DUI, 37 otro, 03 pasaporte, 02 carnet de residente." }
        numDocumento: { type: string, nullable: true, description: "DUI y NIT sin guiones." }
        nrc: { type: string, nullable: true }
        codActividad: { type: string, nullable: true, description: CAT-019. }
        direccion:
          allOf: [{ $ref: "#/components/schemas/Direccion" }]
          nullable: true
        telefono: { type: string, nullable: true }
        correo: { type: string, nullable: true }
        activo: { type: boolean }
        creadoEn: { type: string, format: date-time, nullable: true }
        actualizadoEn: { type: string, format: date-time, nullable: true }

    ClienteEntrada:
      type: object
      required: [nombre]
      additionalProperties: false
      properties:
        nombre: { type: string, maxLength: 250 }
        tipoDocumento: { type: string, example: "13", description: Obligatorio si se manda `numDocumento` (CAT-022). }
        numDocumento: { type: string, description: "Con o sin guiones; se guarda sin ellos (DUI 9 dígitos, NIT 14 o 9). Se comprueba su dígito verificador." }
        nrc: { type: string, nullable: true, description: "2 a 8 dígitos; un solo guion y ceros a la izquierda se normalizan." }
        codActividad: { type: string, nullable: true, description: CAT-019. }
        direccion:
          allOf:
            - $ref: "#/components/schemas/Direccion"
            - type: object
              properties:
                pais: { type: string, example: US, description: "Código CAT-020 de un cliente del exterior; con él Facta propone una exportación. Sin `pais` la dirección es de El Salvador." }
          nullable: true
          description: Entera o nada; con `distrito` obligatorio y coherente (CAT-012/013/008). Conserva `distrito` y, si lo manda, `pais`.
        telefono: { type: string, nullable: true, minLength: 8, maxLength: 30 }
        correo: { type: string, nullable: true, minLength: 6, maxLength: 100 }

    ClienteCambio:
      type: object
      minProperties: 1
      additionalProperties: false
      description: Los mismos campos que `ClienteEntrada`, todos opcionales, más `activo`.
      properties:
        nombre: { type: string, maxLength: 250 }
        tipoDocumento: { type: string, nullable: true }
        numDocumento: { type: string, nullable: true }
        nrc: { type: string, nullable: true }
        codActividad: { type: string, nullable: true }
        direccion:
          allOf: [{ $ref: "#/components/schemas/Direccion" }]
          nullable: true
        telefono: { type: string, nullable: true }
        correo: { type: string, nullable: true }
        activo: { type: boolean, description: "`false` desactiva, `true` reactiva." }

    Producto:
      type: object
      required: [id, descripcion, activo]
      properties:
        id: { type: string, format: uuid }
        codigo: { type: string, nullable: true }
        codigoBarras: { type: string, nullable: true }
        descripcion: { type: string }
        tipoItem: { type: integer, nullable: true, description: "1 bien, 2 servicio, 3 ambos, 4 otro (CAT-011)." }
        uniMedida: { type: integer, nullable: true, description: "CAT-014; 59 es unidad." }
        precioUni: { type: number, nullable: true, description: "Hasta 6 decimales." }
        ivaIncluido: { type: boolean, description: "`true`: el precio ya trae el IVA." }
        tipoVenta: { type: string, enum: [gravada, exenta, no_sujeta], description: Tratamiento de IVA; un producto que nunca eligió uno se lee como `gravada`. }
        activo: { type: boolean }
        actualizadoEn: { type: string, format: date-time, nullable: true }

    ProductoEntrada:
      type: object
      required: [descripcion, tipoItem, precioUni]
      additionalProperties: false
      properties:
        codigo: { type: string, nullable: true, maxLength: 25 }
        codigoBarras: { type: string, nullable: true, maxLength: 50 }
        descripcion: { type: string, minLength: 1, maxLength: 1500 }
        tipoItem: { type: integer, enum: [1, 2, 3, 4] }
        uniMedida: { type: integer, default: 59 }
        precioUni:
          oneOf:
            - { type: number, exclusiveMinimum: 0, maximum: 999999.999999 }
            - { type: string, pattern: "^\\d+(\\.\\d{1,6})?$" }
        ivaIncluido: { type: boolean, default: true }
        tipoVenta: { type: string, enum: [gravada, exenta, no_sujeta], default: gravada, description: Tratamiento de IVA del producto; sin él se lee como `gravada`. }

    ProductoCambio:
      type: object
      minProperties: 1
      additionalProperties: false
      description: Los mismos campos que `ProductoEntrada`, todos opcionales, más `activo`.
      properties:
        codigo: { type: string, nullable: true }
        codigoBarras: { type: string, nullable: true }
        descripcion: { type: string }
        tipoItem: { type: integer, enum: [1, 2, 3, 4] }
        uniMedida: { type: integer }
        precioUni:
          oneOf:
            - { type: number }
            - { type: string }
        ivaIncluido: { type: boolean }
        tipoVenta: { type: string, enum: [gravada, exenta, no_sujeta] }
        activo: { type: boolean, description: "`false` desactiva, `true` reactiva." }

# ── La tabla de errores, código por código ─────────────────────────────────
#
# `components.schemas.Error.code` ya enumera los códigos; esto dice, de cada
# uno, con qué estado sale, cuándo pasa y qué hacer. Vive aquí y no en un
# documento aparte por la misma razón que la taxonomía vive en `errors.ts` y no
# en el plan: una tabla de errores en otro archivo es una tabla que se queda
# vieja. `apps/web/src/api-docs.test.ts` la compara contra `STATUS_FOR` y falla
# si alguien añade un código sin explicarlo.
x-facta-errores:
  unauthorized:
    status: 401
    cuando: No llegó la cabecera `X-Facta-Key`.
    hacer: Mande la llave. Y nunca en `Authorization` — esa la lee el gateway.
  invalid_api_key:
    status: 401
    cuando: La llave no existe, está mal escrita o el secreto no coincide.
    hacer: Los tres casos tardan lo mismo y dicen lo mismo, a propósito. Revise que copió la llave entera, con el punto.
  key_revoked:
    status: 403
    cuando: Alguien la revocó desde la app.
    hacer: Una llave revocada no vuelve. Acuñe otra.
  key_expired:
    status: 403
    cuando: Pasó la fecha de vencimiento que se le puso al acuñarla.
    hacer: Acuñe otra desde Configuración → Llaves de la API.
  key_inactive:
    status: 403
    cuando: La llave está desactivada.
    hacer: Vuelva a activarla desde la app.
  forbidden_scope:
    status: 403
    cuando: A la llave le falta el alcance que la ruta exige.
    hacer: '`details.required` dice cuál hacía falta y `details.granted` los que tiene. Los alcances de emitir y consultar se eligen al acuñar; el dueño concede `catalog:read` y `catalog:write` por llave desde Cuenta → API.'
  dte_type_not_allowed:
    status: 403
    cuando: La llave no tiene permitido ese `tipoDte`.
    hacer: '`details.allowed` trae la lista. Acuñe una llave que incluya el tipo.'
  ip_not_allowed:
    status: 403
    cuando: La llave tiene lista de direcciones y la suya no está en ninguna entrada.
    hacer: Añada su dirección o su rango CIDR al acuñar. La dirección que se compara es la del extremo que conecta; una cabecera puesta por el cliente no la cambia.
  environment_not_allowed:
    status: 403
    cuando: 'El prefijo de la llave y su fila no coinciden, o el ambiente de la llave no es el de su empresa.'
    hacer: 'Si su empresa ya pasó a producción, acuñe una llave de producción; una de pruebas no puede emitir documentos reales.'
  sign_key_required:
    status: 401
    cuando: Falta `X-Facta-Sign-Key` en una ruta que firma — o llegó la de apertura de almacenamiento (`factauk_`), que no es esta.
    hacer: Mande la contraseña del vault de firma, la que empieza con `factask_` y se mostró una vez al acuñar.
  sign_key_invalid:
    status: 401
    cuando: Esa contraseña no abre el vault de firma.
    hacer: '`details.intentosRestantes` dice cuántos quedan antes de que la llave se suspenda sola.'
  sign_vault_locked:
    status: 403
    cuando: Cinco intentos fallidos en una hora. La llave queda suspendida.
    hacer: Esperar no lo arregla. Hay que reactivarla desde la app.
  sign_vault_missing:
    status: 409
    cuando: La llave no está provisionada para firmar, o el certificado que guarda es de otro NIT que el de la empresa.
    hacer: Reintentar no la arregla. Acuñe la llave de nuevo, que es lo que provisiona su vault de firma.
  invalid_request:
    status: 400
    cuando: Cuerpo ausente, que no es JSON, de más de 1 MB, un campo con la forma equivocada, o un código de generación que no tiene forma de UUID.
    hacer: '`details.field` señala el campo cuando lo hay. No gasta correlativo.'
  validation_failed:
    status: 422
    cuando: El documento no cumple el esquema oficial del Ministerio de Hacienda.
    hacer: '`details.issues` lista cada campo. **No gasta correlativo**: la validación corre antes de reservar.'
  retention_mixed_class_unsupported:
    status: 422
    cuando: Se pide `aplicarReteRenta` en un documento con alguna línea `exenta` o `no_sujeta` (`items[].tipoVenta`).
    hacer: 'No se firmó nada ni se gastó correlativo. Emita las líneas exentas o no sujetas en otro documento, o no aplique la retención: la base de la retención de renta para esa mezcla todavía no está confirmada.'
  not_found:
    status: 404
    cuando: No existe el documento, o el `customerId`, o la ruta.
    hacer: Un documento de otra empresa contesta exactamente lo mismo que uno que no existe. Es a propósito.
  method_not_allowed:
    status: 405
    cuando: La ruta existe, pero no con ese método.
    hacer: El mensaje dice cuál es el bueno.
  idempotency_key_required:
    status: 400
    cuando: Falta `Idempotency-Key` en una ruta que no se puede deshacer (emitir, anular o devolver).
    hacer: Elija una cadena por operación. Sin ella, un reintento por timeout quemaría un segundo número.
  idempotency_key_reuse:
    status: 422
    cuando: 'Ya usó esa `Idempotency-Key` con un cuerpo distinto (o, con `X-Facta-Request-Fingerprint`, con otra huella). Si la primera petición terminó, `details` trae `codigoGeneracion`. Ya no se devuelve en `POST /v1/customers` ni `POST /v1/products` cuando la llave creó un registro: ahí se actualiza ese registro (`200`, `actualizado: true`).'
    hacer: Use una nueva. Para cambiar un registro de catálogo, use `PATCH` con el `id`. Devolver la factura de ayer para la venta de hoy sería peor que fallar.
  idempotency_in_flight:
    status: 409
    cuando: La primera petición con esa llave todavía se está procesando.
    hacer: 'Reintente en unos segundos. No se encola a propósito: la primera puede estar gastando un correlativo ahora mismo.'
  prepare_token_invalid:
    status: 422
    cuando: El `prepareToken` venció, es de otra llave, o el documento cambió aunque sea un centavo.
    hacer: Vuelva a llamar a `/v1/dte/prepare`. Lo que se firma tiene que ser lo que obtuvo el número.
  return_exceeds_available:
    status: 422
    cuando: Se pide devolver más de lo que queda de una línea del documento, contando los eventos de retorno anteriores.
    hacer: '`details.lineas` trae, por cada línea (desde 1), lo `solicitado` y lo `disponible`. Pida como máximo lo disponible; no se firmó nada.'
  return_window_closed:
    status: 422
    cuando: '`fechaEvento` es anterior al documento, está en el futuro o cae después del plazo de retorno (tres meses; dos años en ciertas actividades).'
    hacer: Registre el evento de retorno dentro del plazo. Pasado, el documento ya no admite el evento y la salida es otra operación fiscal.
  return_type_not_allowed:
    status: 422
    cuando: El documento no es una factura (01), una factura de exportación (11) ni una de sujeto excluido (14).
    hacer: Los demás tipos se corrigen con una nota de crédito, no con un evento de retorno.
  return_pdf_unavailable:
    status: 404
    cuando: Se pidió el PDF de un evento de retorno y ya no tenemos su JSON firmado para dibujarlo, o se pidió su ticket (no existe).
    hacer: Use el PDF de la respuesta original (`representacionGrafica`) o el que guardó en su almacenamiento. La hoja de un evento de retorno es solo carta.
  has_return_events:
    status: 409
    cuando: Se intenta anular un documento que ya tiene eventos de retorno registrados.
    hacer: Hacienda no permite anularlo (Anexo V 44.4). No se mandó nada; corrija con los eventos de retorno y, si hace falta, una nota de crédito.
  include_limit_exceeded:
    status: 400
    cuando: Se pidió `GET /v1/dte?include=dte` con `limit` mayor que 25.
    hacer: Pida `limit=25` o menos y siga con `siguiente`. `details.maximo` dice el tope. Sin `include` la página sigue siendo de hasta 100.
  not_sealed:
    status: 409
    cuando: Se descarga el JSON (`kind=json`, sin `raw=true`) de un documento que todavía no tiene sello, o sea, en contingencia. El Archivo DTE necesita `selloRecibido`.
    hacer: Espere a que la contingencia se retransmita y el documento se selle, o descargue lo guardado con `raw=true`. `details.estado` dice en qué estado está.
  rate_limited:
    status: 429
    cuando: La llave alcanzó su techo por hora o por día.
    hacer: '`details.window`, `details.remaining` y `details.retryAfterSeconds` dicen cuál y cuánto esperar.'
  amount_limit:
    status: 429
    cuando: El documento pasa del monto máximo por documento de la llave.
    hacer: Se comprueba antes de reservar, así que **no gasta correlativo**. Suba el techo de la llave o divida la operación.
  mh_rejected:
    status: 422
    cuando: Hacienda leyó el documento y lo negó.
    hacer: '**Sí gastó correlativo**, y `details` nombra `codigoGeneracion` y `numeroControl` para que la corrección reuse ESE número (§167). No es 502 porque es un veredicto sobre los datos, no una caída.'
  mh_unreachable:
    status: 502
    cuando: 'Reservado: la versión actual nunca lo devuelve.'
    hacer: Todo fallo de transporte sale como **202 contingencia**, porque para entonces el documento ya está firmado y se le debe a Hacienda.
  correlative_unavailable:
    status: 503
    cuando: No se pudo reservar el correlativo.
    hacer: Reintente con la MISMA `Idempotency-Key`. No se gastó número.
  no_storage_destination:
    status: 422
    cuando: Un destino propio (BYOS) reportado no está entre los destinos publicados de la llave. La emisión ya NO devuelve este error por falta de almacenamiento (desde el 6-oct-2026).
    hacer: 'Sincronice los destinos desde la app. Para emitir sin almacenamiento disponible no hace falta nada: el documento se emite y la respuesta trae `advertencias`.'
  storage_unsupported:
    status: 501
    cuando: El servidor todavía no publica la capacidad o ruta de almacenamiento administrado.
    hacer: El SDK conserva compatibilidad y marca la capacidad como desconocida; actualice el servidor antes de depender de ella.
  storage_unavailable:
    status: 503
    cuando: 'La copia administrada no se pudo consultar o reparar temporalmente. También lo devuelve la emisión, con `Retry-After`, cuando el interruptor de emergencia está abierto (la copia temporal viene fallando para esa empresa y no hay otro almacenamiento): no se gastó correlativo.'
    hacer: 'Reintente solo la operación de almacenamiento. No vuelva a emitir el DTE. Si fue una emisión rechazada por el interruptor, espere `Retry-After` y reintente con la MISMA `Idempotency-Key`.'
  entrega_token_invalido:
    status: 401
    cuando: El `token` de entrega no corresponde a este documento y canal, está mal escrito, o el documento no tiene token (estaba en contingencia, o ningún canal se podía entregar).
    hacer: Use el token exacto que devolvió la emisión (`entrega.token`). Si no lo tiene, el estado se lee con `GET /v1/dte/{codigoGeneracion}/entrega`.
  entrega_vencida:
    status: 410
    cuando: Pasaron más de 5 minutos desde la emisión y el canal todavía no se había entregado.
    hacer: No se reintenta con ese token. El documento ya está emitido; entréguelo por sus propios medios o desde la app.
  canal_no_marcado:
    status: 409
    cuando: El documento no marcó ese canal en `entrega` al emitirse.
    hacer: Los canales se marcan al emitir. Revise con `GET /v1/dte/{codigoGeneracion}/entrega` cuáles quedaron marcados.
  catalog_write_disabled:
    status: 403
    cuando: Una ruta de escritura del catálogo (`POST`, `PATCH` o `DELETE` en `/v1/customers` y `/v1/products`) y el dueño de la cuenta no ha permitido administrar clientes y productos desde el API.
    hacer: 'El dueño lo activa en Cuenta → API → «Permitir administrar clientes y productos desde el API» (eso guarda el catálogo sin cifrar en Facta DTE) y concede `catalog:write` a la llave. Se comprueba antes que el alcance y no cambia nada.'
  catalog_encrypted:
    status: 409
    cuando: Una ruta del catálogo y los clientes y productos de la empresa están cifrados (o una ficha quedó cifrada a medias de una conversión).
    hacer: El servidor no puede leer un catálogo cifrado. El dueño lo guarda sin cifrar en Cuenta → API; hasta entonces, `customerId` y `productId` se resuelven con el SDK y el vault abierto.
  catalog_duplicate:
    status: 409
    cuando: Ya existe un cliente con ese documento, o un producto con ese código.
    hacer: '`details.id` dice cuál y `details.activo` si está desactivado. Edítelo con `PATCH`, o reactívelo con `{"activo": true}`.'
  service_unavailable:
    status: 503
    cuando: Algo nuestro no contestó — la base, el registro de peticiones, el de idempotencia.
    hacer: Reintente con la misma `Idempotency-Key`.
  internal_error:
    status: 500
    cuando: Un fallo que no estaba previsto.
    hacer: El mensaje nunca describe nuestras entrañas. Si se repite, escriba a soporte con la hora y el `keyId`.
