  /v1/products:
    get:
      tags: [Catálogo]
      operationId: listarProductos
      summary: Listar o buscar los productos de la empresa
      description: |
        **Alcance: `catalog:read`** (o `catalog:write`, que lo incluye).

        Funciona si la empresa guarda su catálogo sin cifrar, o si publicó una
        copia legible para esta llave; la respuesta tiene los mismos campos en
        los dos casos. Con el catálogo cifrado y sin copia, `409
        catalog_encrypted` (el SDK lo descifra con `unlockKey`). `buscar` mira descripción, código (por prefijo)
        y código de barras (exacto). Orden estable por `id`.
      parameters:
        - $ref: "#/components/parameters/CatalogoBuscar"
        - $ref: "#/components/parameters/CatalogoLimite"
        - $ref: "#/components/parameters/CatalogoCursor"
        - $ref: "#/components/parameters/CatalogoInactivos"
      responses:
        "200":
          description: Una página de productos activos (o todos con `incluirInactivos=true`).
          content:
            application/json:
              schema:
                type: object
                required: [productos, siguiente]
                properties:
                  productos:
                    type: array
                    items: { $ref: "#/components/schemas/Producto" }
                  siguiente: { type: string, nullable: true }
        "400": { $ref: "#/components/responses/CatalogoPeticionInvalida" }
        "401": { $ref: "#/components/responses/NoAutorizado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "409": { $ref: "#/components/responses/CatalogoCifrado" }
        "429": { $ref: "#/components/responses/Techo" }
        "503": { $ref: "#/components/responses/NoDisponible" }
    post:
      tags: [Catálogo]
      operationId: crearProducto
      summary: Crear un producto o servicio
      description: |
        **Alcance: `catalog:write`.** Y la empresa tiene que haber permitido
        administrar el catálogo desde el API; si no, `403 catalog_write_disabled`.

        Obligatorios: `descripcion` (hasta 1500 caracteres), `tipoItem` (1 bien,
        2 servicio, 3 ambos, 4 otro — **nunca se asume**) y `precioUni` (un
        número o una cadena decimal, mayor que cero, hasta 6 decimales y menor
        que 1,000,000). `uniMedida` es opcional y vale 59 (unidad) si falta;
        `ivaIncluido` vale `true`. Si ya existe un producto con ese `codigo`,
        `409 catalog_duplicate`.

        `tipoVenta` es el tratamiento de IVA del producto: `gravada`, `exenta` o
        `no_sujeta`, con los mismos valores que `items[].tipoVenta` al emitir. Se
        elige, no se deduce: si falta, el producto se lee como `gravada`. Al
        emitir con `productId`, la línea hereda el tratamiento del producto salvo
        que usted mande otro (aplica a los tipos 01, 03, 05 y 06; la exportación
        es siempre de tasa cero y el sujeto excluido documenta una compra).

        `Idempotency-Key` es opcional aquí: crear es reversible (se desactiva).
        Repetir la misma petición devuelve el mismo producto. Repetir la misma
        llave con OTRO cuerpo actualiza ese mismo producto (la llave solo alcanza
        al registro que ella creó): los campos enviados lo sobrescriben, los
        omitidos se conservan, `activo` no cambia, y la respuesta es `200` con
        `actualizado: true`. Pasan las mismas validaciones y compuertas que
        `PATCH`; si el `codigo` nuevo choca con OTRO producto es `409
        catalog_duplicate` y la llave sigue apuntando a su registro.

        La llave identifica a ese producto **para siempre**, no solo las 24 h que
        se recuerdan las respuestas: pasado ese plazo, repetir la llave sigue
        actualizando el producto que creó (`200`, `actualizado: true`) en vez de
        crear uno nuevo. Si el producto ya no existe, la petición crea uno nuevo
        y la llave pasa a apuntarle.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyOpcional"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductoEntrada" }
      responses:
        "201":
          description: El producto creado.
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema:
                type: object
                required: [producto]
                properties:
                  producto: { $ref: "#/components/schemas/Producto" }
        "200":
          description: >-
            La misma `Idempotency-Key` llegó con otro cuerpo: se aplicó al producto
            que esa llave creó (semántica de `PATCH`). También es el status de la
            repetición de esa respuesta, con `Idempotency-Replayed: true`.
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema:
                type: object
                required: [producto, actualizado]
                properties:
                  producto: { $ref: "#/components/schemas/Producto" }
                  actualizado: { type: boolean, enum: [true] }
        "400": { $ref: "#/components/responses/CatalogoPeticionInvalida" }
        "401": { $ref: "#/components/responses/NoAutorizado" }
        "403": { $ref: "#/components/responses/CatalogoProhibido" }
        "409": { $ref: "#/components/responses/CatalogoConflicto" }
        "422": { $ref: "#/components/responses/CatalogoInvalido" }
        "429": { $ref: "#/components/responses/Techo" }
        "503": { $ref: "#/components/responses/NoDisponible" }

