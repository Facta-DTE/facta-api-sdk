# Snapshot of openapi.yaml from MarvinQuevedo/FactaDTE feat/rg-dynamic-fields (23d492b29, PR #509; replace with the staging commit once it merges), used by test/error-codes.test.ts. Refresh by copying the file.
openapi: 3.1.0

# El contrato de cable de la API pública de Facta.
#
# Esto es la **T1b** que pide `docs/plan/tareas/api-publica.md` §18: el plan
# nombraba quince rutas con una línea cada una y medía, sobre sí mismo, que le
# faltaban los tipos de contenido, los códigos de estado, los nombres de
# cabecera, la taxonomía de errores y la semántica de `Idempotency-Key`. Todo
# eso está aquí, y está escrito DESDE el servidor que ya emite con sello real,
# no antes: cada decisión de abajo salió de implementarla o de que el
# Ministerio de Hacienda la corrigiera en vivo.
#
# ALCANCE — lo que describe es el ESQUELETO, no la API entera del plan. Faltan
# a propósito: `/v1/dte/submit` (modo BYOK), `/v1/notes`, `/v1/dte/{cg}/invalidate`,
# `/v1/destinations`, `/v1/dte/{cg}/copies`, `/v1/dte/pending-copies`,
# `/v1/dte/{cg}/render`, `/v1/webhooks` y el listado paginado `GET /v1/dte`.
# Cuando existan, se añaden aquí y el número de versión sube.
#
# LAS SEIS DECISIONES DE CABLE, dichas una vez:
#
#   1. La llave viaja en `X-Facta-Key`, NUNCA en `Authorization`. La API vive
#      detrás del gateway de Supabase, que lee `Authorization` por su cuenta;
#      meter ahí una llave opaca es pedirle a dos sistemas que interpreten el
#      mismo encabezado.
#   2. Todo cuerpo es `application/json; charset=utf-8`, y toda respuesta
#      también — incluidos los errores.
#   3. Un error SIEMPRE es `{ "error": { "code", "message", "details" } }`.
#      `code` es el contrato y no cambia; `message` es español para humanos y
#      puede reescribirse. Un cliente que haga `switch` sobre `message` está mal
#      escrito.
#   4. `Idempotency-Key` es OBLIGATORIA en las tres rutas que gastan
#      correlativo. Alcance `(llave, Idempotency-Key)`, TTL 24 h, y reusar la
#      misma llave con otro cuerpo es 422 y no una repetición silenciosa.
#   5. Un rechazo del MH es **422**, no 502: Hacienda LEYÓ el documento y lo
#      negó, así que es un problema de los datos de quien llama. Y la respuesta
#      nombra el correlativo que se gastó, porque el §167 permite corregir con
#      ESE mismo número.
#   6. El emisor, el ambiente, el establecimiento y el punto de venta salen de
#      la base a partir de la llave. El cliente no los puede nombrar, ni
#      equivocarse en ellos, ni mentirlos.
#
# REVISADO CONTRA EL CÓDIGO el 8-sep-2026, ruta por ruta y campo por campo
# (`docs/plan/tareas/api-documentacion-y-mejoras.md` §2). Lo que esa revisión
# corrigió aquí: el `almacenamiento` que faltaba en la respuesta de
# contingencia, el alcance que exige cada ruta, el techo de 1 MB del cuerpo,
# las respuestas 404/405 que ninguna operación declaraba, y que `mh_unreachable`
# (502) hoy NO se devuelve nunca — todo fallo de transporte sale como 202.

info:
  title: Facta — API de facturación electrónica (DTE) de El Salvador
  version: 0.1.0-esqueleto
  summary: Emite documentos tributarios electrónicos sellados por el Ministerio de Hacienda.
  description: |
    Una llamada HTTP con una llave de API produce un DTE firmado y sellado por
    el MH. El cliente describe la venta —quién, qué, cuánto cada cosa— y el
    servidor hace todo lo fiscal: correlativo transaccional, totales, IVA,
    monto en letras, firma JWS RS512 y transmisión.

    **El cliente nunca calcula dinero y nunca firma.** Un SDK que calculara IVA
    sería un segundo motor fiscal, y dos motores se desincronizan el primer
    martes (`docs/plan/tareas/sdks-de-la-api.md` §5).

    **La llave decide el ambiente, y tiene que coincidir con el de su empresa.**
    Una llave `facta_test_` emite en pruebas (00) contra `apitest`; una
    `facta_live_` emite documentos fiscales reales (01). Las dos usan la MISMA
    URL base: lo que cambia es la llave.

    Una llave de producción solo se puede acuñar para una empresa que YA pasó su
    propia ceremonia de paso a producción —la que puso su certificado y su
    credencial de transmisión de verdad—, y el servidor compara los dos
    ambientes antes de firmar nada. Cruzarlos es `403 environment_not_allowed`:
    una llave de pruebas no emite un documento real, y una de producción no
    ensucia el ambiente de pruebas.

    **La ruta decide, y el método se comprueba después.** Una ruta que existe
    con el método equivocado responde `405 method_not_allowed`; una ruta que no
    existe, `404 not_found`. Ese orden no es un detalle de implementación: si
    decidiera el método, un `POST` a una ruta de consulta caería en el emisor y
    quemaría un correlativo.

    **Cada ruta exige un alcance de la llave**, y la llave los lleva escritos:
    `issue` para las tres que emiten, `query` para la consulta, `download` para
    el área de retención, y `catalog:read` / `catalog:write` para listar y
    administrar clientes y productos (nunca vienen de fábrica: el dueño los
    concede por llave, y `catalog:write` además exige que la empresa haya
    permitido el catálogo sin cifrar). Entregar por correo o WhatsApp lo que se emitió viene
    incluido con `issue` (`entrega:correo` y `entrega:whatsapp` siguen valiendo
    para una llave que solo tenga ese alcance). `/v1/status` no exige ninguno. Un alcance
    que falta es `403 forbidden_scope`, y `details` dice cuál hacía falta y
    cuáles tiene.

    **Entregar por correo o WhatsApp son dos pasos, y emitir nunca espera.**
    La petición de emisión solo *marca* los canales (`entrega`); si el
    documento sale sellado y marcó algún canal, la respuesta trae un **token de
    entrega** que vale 5 minutos desde la emisión. Cada canal se entrega con su
    propia petición (`/entrega/correo`, `/entrega/whatsapp`) que presenta ese
    token, y el estado se lee con `GET /v1/dte/{codigoGeneracion}/entrega`, que
    sigue respondiendo después de los 5 minutos. Un canal que no se pudo
    entregar (dirección rechazada, sin saldo de WhatsApp, sin consentimiento,
    proveedor caído) es un **estado con un motivo**, nunca un error de la
    emisión.

    **El cuerpo no puede pasar de 1 MB** (`400 invalid_request`). Dos mil
    líneas de detalle caben de sobra; un archivo adjunto no es asunto de esta
    API.

    **Toda respuesta dice cuánto cupo queda**, en `RateLimit-Limit`,
    `RateLimit-Remaining` y `RateLimit-Reset`, más `RateLimit-Policy` con las
    dos ventanas. Los números describen la que está MÁS cerca de morder: con
    5 llamadas libres en la hora y 1 en el día, lo que se anuncia es 1 — decir
    5 sería invitar a un 429 en la segunda. Y cuando toca esperar —429, 409 en
    vuelo, 503— la respuesta trae además `Retry-After` en segundos.

    **Consultar el estado no gasta el techo que reporta.** `/v1/status` se
    cuenta en una ventana propia y generosa (240 por hora de fábrica), porque
    un monitor que pregunta cada minuto se comía el cupo de emitir. Sigue
    contándose: una ruta sin medir es un martillo gratis para una llave
    robada.

    Las rutas `storage` negocian `capabilityVersion: 1` de forma aditiva. Un
    servidor anterior puede responder 404; el SDK lo informa como capacidad
    desconocida/no compatible. El recibo de almacenamiento no cambia el hecho
    fiscal de que el MH ya selló el documento.
  contact:
    name: Facta
    url: https://factadte.com
  license:
    name: Propietaria

servers:
  - url: https://hcnvknpsbadplnfcflxx.supabase.co/functions/v1/api-v1
    description: |
      URL pública única de Facta. La llave selecciona el ambiente del
      Ministerio de Hacienda: `facta_test_` transmite a `apitest.dtes.mh.gob.sv`
      y `facta_live_` al servicio de producción. Las pruebas se ejecutan en
      esta misma URL con el certificado y la llave de pruebas; no se publica
      una segunda URL de staging.

      El prefijo `/functions/v1/api-v1` se normaliza en el servidor, así que
      `…/functions/v1/api-v1/v1/dte` y `…/v1/dte` llegan a la misma ruta. Los
      caminos de abajo son los que se escriben DESPUÉS de esta URL base.

security:
  - FactaApiKey: []
  # `X-Facta-Sign-Key` NO va aquí: no es un esquema de seguridad global, es un
  # segundo factor que solo piden las rutas que firman. Declararlo global haría
  # creer a un generador de clientes que `/v1/status` lo necesita — y la mitad
  # del diseño de §6 es justamente que consultar NO lo necesita.

tags:
  - name: Emisión
    description: Las rutas que gastan un correlativo. Todas exigen `Idempotency-Key`.
  - name: Consulta
    description: Leer lo emitido. No gastan nada.
  - name: Entrega
    description: |
      Entregar por correo o WhatsApp un documento ya emitido, con el token de
      cinco minutos que devolvió la emisión. Cada canal es una petición y es
      idempotente; un canal que falla es un estado con motivo, no un error.
  - name: Salud
    description: Estado de la llave y techos restantes.
  - name: Catálogo
    description: |
      Leer y administrar los clientes y productos de la empresa. **Solo existe
      para una empresa cuyo dueño guardó el catálogo sin cifrar** (Cuenta → API →
      «Permitir administrar clientes y productos desde el API»): el servidor
      tiene que poder leer las filas para escribirlas. Las lecturas piden
      `catalog:read`; crear, editar y desactivar piden `catalog:write` y que el
      dueño haya abierto ese permiso. Borrar es **desactivar**: la ficha
      queda, deja de salir en las listas y de resolverse por `customerId` /
      `productId`, y se reactiva con `{"activo": true}`.
  - name: Almacenamiento
    description: |
      Estado, recibos y recuperación de copias JSON/PDF administradas por
      Facta, además del área temporal de retención. Las consultas requieren
      `download`; la reparación requiere `download` e `issue`. La escritura
      administrada la hace el servidor tras sellar y no expone credenciales,
      objetos ni enlaces al SDK.

paths:
  /v1/openapi.json:
    get:
      tags: [Salud]
      operationId: contrato
      summary: El contrato de esta API, servido por ella misma
      description: |
        **Alcance: ninguno — y tampoco hace falta llave.**

        Es la única ruta que no autentica, y la razón es el orden de las cosas:
        lo primero que necesita quien va a integrar es saber qué hay, y eso
        ocurre antes de tener una llave. No gasta cupo, no deja fila en la
        bitácora y se puede leer desde un navegador (`Access-Control-Allow-Origin: *`).

        Son los mismos bytes que sirve `/api/openapi.json` en el sitio, salidos
        del mismo archivo. Si el sitio estuviera caído, la API sigue sabiendo
        describirse.
      security: []
      responses:
        "200":
          description: Este mismo documento, en JSON.
          headers:
            Cache-Control: { schema: { type: string }, description: "`public, max-age=3600`." }
          content:
            application/json:
              schema: { type: object, description: Un documento OpenAPI 3.1. }
        "405":
          description: Solo GET (y HEAD).
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/status:
    get:
      tags: [Salud]
      operationId: status
      summary: Salud, ambiente y techos restantes
      description: |
        **Alcance: ninguno.** Cualquier llave viva contesta aquí.

        Lo primero que llama un integrador. Confirma que la llave sirve, dice
        para qué empresa emite, en qué ambiente y cuánto cupo le queda.

        Ojo: la petición se cuenta a sí misma. Llamar a `/v1/status` gasta una
        unidad de los techos por hora y por día, porque el contador se escribe
        ANTES de trabajar (ver `Techos`).
      responses:
        "200":
          description: La llave es válida.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "401": { $ref: "#/components/responses/NoAutorizado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "429": { $ref: "#/components/responses/Techo" }
        "503": { $ref: "#/components/responses/NoDisponible" }

  /v1/representacion/plantillas:
    get:
      tags: [Consulta]
      operationId: plantillasDeRepresentacion
      summary: Plantillas que esta llave puede pedir en `representacion.plantilla`
      description: |
        **Alcance: `query`.** La empresa sale de la llave.

        Lista las plantillas de carta (PDF) y de ticket que se pueden nombrar en
        `representacion.plantilla`: las del catálogo y las plantillas propias
        **publicadas** de la empresa (`custom:<uuid>`). Cada una trae si esta
        empresa puede usarla **ahora** (`permitida`, con el mismo criterio que
        aplica la emisión: el plan vigente, nunca lo que diga la petición) y,
        si no, el `motivo`: `plan` (su plan no la incluye) o `incompatible`
        (con `tipoDte`, un ticket de un tipo de documento que no tiene ticket;
        o una plantilla propia que ya no se puede dibujar).

        `clavesDatos` son las claves de `representacion.datos` que esa plantilla
        imprime (`filas` si imprime filas libres). Las plantillas del catálogo
        no imprimen datos por venta; los imprimen las plantillas propias que
        los declaran. `predeterminada` es la elección actual de la empresa, la
        que se usa cuando la petición no pide ninguna.

        No devuelve datos de clientes ni de documentos.
      security: [{ FactaApiKey: [] }]
      parameters:
        - name: tipoDte
          in: query
          required: false
          description: Código del tipo de documento (`01`, `03`, `05`, `06`, `11`, `14`). Ajusta `permitida` a ese tipo. Otro valor es `400`.
          schema: { type: string, enum: ["01", "03", "05", "06", "11", "14"] }
      responses:
        "200":
          description: Las plantillas y la elección actual de la empresa.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlantillasDisponibles" }
        "400": { description: "`tipoDte` desconocido.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/NoAutorizado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "429": { $ref: "#/components/responses/Techo" }
        "503": { $ref: "#/components/responses/NoDisponible" }

  /v1/storage/status:
    get:
      tags: [Almacenamiento]
      operationId: estadoAlmacenamiento
      summary: Consultar capacidad administrada y destino BYOS verificado
      description: |
        **Alcance: `download`.** La empresa y el ambiente salen de la llave.

        `capabilityVersion: 1` identifica este contrato. `managed.ready` solo
        significa que integración, cobertura, bucket y cupo permiten nuevas
        escrituras ahora; una reserva concurrente vuelve a comprobar el cupo.
        `accessUntil` describe la ventana de lectura existente, no una promesa
        de respaldo. Se conservan los estados de destinos BYOS verificados.
      security: [{ FactaApiKey: [] }]
      responses:
        "200":
          description: Estado aislado por empresa y ambiente.
          content: { application/json: { schema: { $ref: "#/components/schemas/ManagedStorageStatus" } } }
        "401": { $ref: "#/components/responses/NoAutorizado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "429": { $ref: "#/components/responses/Techo" }
        "503": { $ref: "#/components/responses/NoDisponible" }

  /v1/storage/copies:
    get:
      tags: [Almacenamiento]
      operationId: listarCopiasAdministradas
      summary: Consultar recibos de copias JSON/PDF
      description: |
        **Alcance: `download`.** Solo enumera la empresa y el ambiente de la llave.
        Incluye reservas pendientes para poder recuperarlas. No devuelve rutas,
        enlaces temporales, documentos ni credenciales. Se limita a 500 filas;
        `generationCode` acota una consulta a un DTE.
      security: [{ FactaApiKey: [] }]
      parameters:
        - name: generationCode
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Recibos administrados del ambiente de la llave.
          content: { application/json: { schema: { $ref: "#/components/schemas/ManagedDocumentCopies" } } }
        "400": { description: Código de generación inválido., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/NoAutorizado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "429": { $ref: "#/components/responses/Techo" }
        "503": { $ref: "#/components/responses/NoDisponible" }

  /v1/storage/copies/{codigoGeneracion}/repair:
    post:
      tags: [Almacenamiento]
      operationId: repararCopiasAdministradas
      summary: Reintentar JSON/PDF de un DTE ya sellado
      description: |
        **Alcance: `download`.** También requiere `issue` para autorizar la
        escritura de copias; esta ruta no llama a Hacienda, no reserva correlativos y no
        vuelve a emitir. Recupera el JSON firmado y el PDF canónico guardados
        por la API y los reenvía con reserva, cuota e idempotencia por artefacto.
        El JSON se reconstruye siempre del JWS firmado, byte por byte. Si ya
        no existe el PDF original (la retención dura una hora), la hoja se
        **vuelve a dibujar** desde el mismo documento, sello y fecha de
        procesamiento del Ministerio, y la respuesta lo dice con
        `storage.pdfRegenerated: true`: es una copia fiel, no el archivo
        original. Un fallo al escribir nunca falla el documento: el recibo
        queda `pending` o `failed` y la llamada responde 200.
      security: [{ FactaApiKey: [] }]
      parameters:
        - name: codigoGeneracion
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Recibo actualizado de cada artefacto administrado.
          content: { application/json: { schema: { type: object, required: [codigoGeneracion, storage], properties: { codigoGeneracion: { type: string, format: uuid }, storage: { allOf: [{ $ref: "#/components/schemas/ManagedStorageReceipt" }, { type: object, properties: { pdfRegenerated: { type: boolean, description: "Verdadero si la hoja se dibujó de nuevo porque no sobrevivió el PDF original." } } }] } } } } }
        "400": { description: Código de generación inválido., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/NoAutorizado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEnElArea" }
        "429": { $ref: "#/components/responses/Techo" }
        "503": { $ref: "#/components/responses/NoDisponible" }

  /v1/storage/copies/{codigoGeneracion}/byos:
    post:
      tags: [Almacenamiento]
      operationId: reportarCopiaByos
      summary: Informar una copia escrita en un destino propio (BYOS)
      description: |
        **Alcance: `issue`.** El SDK escribe el JSON y el PDF en un
        destino de la empresa y aquí lo avisa para que Facta pueda contarla y,
        si hace falta, repararla desde la app. Facta no recibe los archivos ni
        las credenciales del destino: es una afirmación sobre una ruta.

        Se rechaza (sin confirmar que el documento exista) un documento de otra
        empresa o ambiente, y un `secretId` que no esté en los destinos
        publicados de esta llave (`syncRequired: true`; sincronice los destinos
        desde la app). Las rutas deben ser las canónicas del documento:
        `DTE/pruebas/YYYY/MM/<numeroControl>.json|pdf` en pruebas y
        `DTE/YYYY/MM/<numeroControl>.json|pdf` en producción. Es idempotente y
        un reporte nunca borra una verificación anterior. Una copia informada
        queda como «informada», nunca como «verificada»: Facta no puede leer
        el objeto de vuelta con las credenciales del destino, así que `verified`
        de la respuesta es siempre `false` y el campo `verified` de la petición
        se ignora.

        **También acepta el código de un EVENTO de retorno sellado**: las rutas
        son las del documento al que se aplicó, con el código del evento (en
        mayúsculas) como nombre: `DTE/pruebas/YYYY/MM/<CODIGO-DEL-EVENTO>.json|pdf`
        en pruebas y `DTE/YYYY/MM/<CODIGO-DEL-EVENTO>.json|pdf` en producción.
        Anunciada por `capabilities.byosCopyReport` en `/v1/storage/status`.
      security: [{ FactaApiKey: [] }]
      parameters:
        - name: codigoGeneracion
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secretId, jsonPath]
              properties:
                secretId: { type: string, format: uuid, description: "El `id` del destino en los destinos sincronizados." }
                jsonPath: { type: string }
                pdfPath: { type: string, nullable: true }
                verified: { type: boolean, deprecated: true, description: "Se ignora: una copia informada nunca queda verificada." }
                pdfRegenerated: { type: boolean }
      responses:
        "200":
          description: Copia registrada.
          content:
            application/json:
              schema:
                type: object
                required: [codigoGeneracion, copy]
                properties:
                  codigoGeneracion: { type: string, format: uuid }
                  copy:
                    type: object
                    required: [secretId, recorded, verified, writtenBy]
                    properties:
                      secretId: { type: string, format: uuid }
                      recorded: { type: boolean }
                      verified: { type: boolean }
                      writtenBy: { type: string, enum: [sdk] }
        "400": { description: Cuerpo, código o rutas inválidos., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/NoAutorizado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEnElArea" }
        "422": { description: El destino no está en los destinos sincronizados de la llave., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/Techo" }
        "503": { $ref: "#/components/responses/NoDisponible" }

  /v1/vault/destinations:
    get:
      tags: [Almacenamiento]
      operationId: descargarVaultDestinos
      summary: Descargar el vault cifrado de destinos de esta llave
      description: |
        **Alcance: ninguno**

        Requiere `X-Facta-Key`. Devuelve únicamente las envolturas y el
        ciphertext de destinos de esta llave. `FACTA_UNLOCK_KEY` nunca se
        envía: el SDK abre este contenido localmente. Llaves anteriores al
        protocolo de sincronización reciben `syncStatus: legacy`. La respuesta
        lleva `Cache-Control: private, no-store`.

        **Una lista atrasada se sirve, no se niega.** Si los destinos de la
        empresa cambiaron después de la última publicación, `syncStatus` es
        `stale`, `desiredRevision` y `publishedRevision` dicen cuánto, y
        `warnings` trae `{ code: "destinations_stale", message, desiredRevision,
        publishedRevision }`. El `vault` sigue siendo la última lista publicada:
        úsela. `inactiveDestinationIds` lista los destinos desactivados o
        revocados desde entonces (es siempre un arreglo, vacío cuando no hay):
        el SDK debe quitarlos de la lista descifrada y nunca escribir en ellos.
        La app republica sola al desbloquear el vault y tras cada cambio de
        almacenamiento; mientras tanto no se rechaza ninguna emisión por esto.
      responses:
        "200":
          description: Vault cifrado y cursor de sincronización.
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/NoAutorizado" }
        "503": { $ref: "#/components/responses/NoDisponible" }

  /v1/dte:
    post:
      tags: [Emisión]
      operationId: emitirDte
      summary: Emitir un DTE en una sola llamada
      description: |
        **Alcance: `issue`.** Y `X-Facta-Sign-Key`, que es el segundo factor.

        `prepare` + `sign` en un solo viaje. Es la ruta normal: reserva el
        correlativo, construye y valida contra el esquema oficial, firma con el
        certificado del emisor, transmite al MH y escribe la fila de índice.

        **El orden importa y no es negociable**: se construye, se valida y se
        comprueba el techo de monto ANTES de reservar. Nada por debajo de la
        reserva se puede devolver.

        **`advertencias`.** Si la lista de destinos publicada para esta llave
        está atrasada respecto a la de la empresa, la emisión **no se rechaza**:
        la respuesta lleva `advertencias: [{ codigo: "destinations_stale",
        mensaje, revisionDeseada, revisionPublicada }]` (y la de `prepare`
        también). Solo un vault de **firma** atrasado se rechaza
        (`sign_vault_missing`): sus credenciales cambiaron.

        Devuelve el JWS firmado además del documento: es lo que el cliente
        archiva, porque volver a serializar el JSON después no reproduce los
        mismos bytes que Hacienda validó.

        **Entrega opcional.** `entrega` marca el correo y/o el WhatsApp del
        receptor, y nada más: emitir nunca espera a una entrega ni falla por
        ella. Si el documento sale sellado y marcó algún canal que la llave
        puede usar, la respuesta trae `entrega.token`, que vale 5 minutos y se
        presenta en `/entrega/correo` y `/entrega/whatsapp`. Repetir la misma
        petición con la misma `Idempotency-Key` devuelve el mismo token
        mientras siga vigente. Un documento en contingencia deja los canales
        `esperando_sello` y no trae token.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestFingerprint"
        - $ref: "#/components/parameters/SignKey"
        - $ref: "#/components/parameters/DeferCopies"
        - $ref: "#/components/parameters/DebugTimings"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SolicitudDte" }
            examples:
              facturaConEntregaPorCorreoYWhatsapp:
                summary: FE con entrega por correo y WhatsApp (dos pasos)
                value:
                  tipoDte: "01"
                  receptor: { nombre: "María López", correo: "maria@example.com" }
                  items:
                    - descripcion: "Café"
                      cantidad: 2
                      precioUni: 1.5
                  entrega:
                    correo: true
                    whatsapp: { numero: "+50370001234", consentimiento: true }
              creditoFiscalPorClienteGuardado:
                summary: CCF a un cliente que ya vive en Facta
                value:
                  tipoDte: "03"
                  receptor: { customerId: "374114b6-e957-4c7a-8911-dd6381b1e0ea" }
                  items:
                    - descripcion: "Integración de la API de facturación electrónica"
                      cantidad: 1
                      precioUni: 25
              creditoFiscalReceptorInline:
                summary: CCF con datos inline, sin guardar el cliente en Facta
                value:
                  tipoDte: "03"
                  receptor:
                    nombre: "Comercial Ejemplo, S.A. de C.V."
                    tipoDocumento: "36"
                    numDocumento: "06141234567890"
                    nrc: "1234567"
                    codActividad: "46510"
                    descActividad: "Venta al por mayor de equipo"
                    direccion:
                      departamento: "06"
                      municipio: "20"
                      complemento: "Colonia Centro, San Miguel"
                    correo: "compras@example.com"
                  items:
                    - descripcion: "Equipo"
                      cantidad: 1
                      precioUni: 125
              facturaAConsumidorFinal:
                summary: FE sin receptor (consumidor final anónimo)
                value:
                  tipoDte: "01"
                  items:
                    - descripcion: "Café"
                      cantidad: 2
                      precioUni: 1.5
              facturaConLineasDeTresClases:
                summary: FE con una línea gravada, una exenta y una no sujeta
                value:
                  tipoDte: "01"
                  items:
                    - descripcion: "Equipo de oficina"
                      cantidad: 1
                      precioUni: 113
                    - descripcion: "Intereses de préstamo (institución supervisada por la SSF)"
                      cantidad: 1
                      precioUni: 50
                      tipoVenta: exenta
                    - descripcion: "Reembolso de gastos"
                      cantidad: 1
                      precioUni: 30
                      tipoVenta: no_sujeta
      responses:
        "200":
          description: |
            Sellado por el MH. `Idempotency-Replayed: true` si esta respuesta ya
            estaba guardada de un intento anterior con la misma llave.
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DteSellado" }
        "202":
          description: |
            El documento quedó FIRMADO pero el MH no respondió. No es un fallo
            que se reintente: los bytes existen y se le deben a Hacienda. La
            reserva queda retenida en contingencia y se retransmite después; los
            plazos (24 h / 72 h) son de la ley, no nuestros.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DteEnContingencia" }
        "400":
          description: |
            Cuerpo mal formado, ausente, de más de 1 MB, o falta
            `Idempotency-Key`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/NoAutorizado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404":
          description: |
            El `customerId` o un `productId` no existe en la empresa de la llave
            (o, con catálogo legible, en el catálogo publicado: `detail.reason`
            es `catalog_unknown_id` y `detail.catalogStale` dice si el catálogo
            publicado va atrasado).
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409": { $ref: "#/components/responses/EnVueloOSinVault" }
        "422":
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          description: |
            El documento no pasó — y hay dos razones muy distintas:

            · `validation_failed`: no cumple el esquema oficial. **No se gastó
              correlativo**; `details.issues` dice qué campo.
            · `retention_mixed_class_unsupported`: `aplicarReteRenta` sobre líneas
              exentas o no sujetas. **No se gastó correlativo**.
            · `mh_rejected`: Hacienda lo leyó y lo negó. **Sí se gastó**, y
              `details` nombra `codigoGeneracion` y `numeroControl` para que la
              corrección los reuse (§167).
            · `idempotency_key_reuse`: la misma llave con otro cuerpo.
            · `no_storage_destination`: **ya no lo devuelve la emisión** (desde el
              6-oct-2026). Sin almacenamiento disponible el documento se emite
              igual y la respuesta trae la advertencia `sin_almacenamiento_duradero`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                rechazoDelMh:
                  value:
                    error:
                      code: mh_rejected
                      message: "[receptor.nit] NIT CONTRIBUYENTE NO EXISTE"
                      details:
                        estado: RECHAZADO
                        descripcionMsg: "[receptor.nit] NIT CONTRIBUYENTE NO EXISTE"
                        observaciones: []
                        codigoGeneracion: E4311553-DADF-4168-829E-B6B7E50F1D41
                        numeroControl: DTE-03-M001P001-000000000000177
        "429": { $ref: "#/components/responses/Techo" }
        "500": { $ref: "#/components/responses/ErrorInterno" }
        "502": { $ref: "#/components/responses/MhCaido" }
        "503": { $ref: "#/components/responses/NoDisponible" }

    get:
      tags: [Consulta]
      operationId: listarDte
      summary: Listar lo emitido, por rango de fechas
      description: |
        **Alcance: `query`.**

        La pregunta que hace un sistema que se cayó y volvió: qué alcancé a
        emitir. Devuelve el libro de lo sellado (`dte_index`) de la empresa de
        la llave, del más nuevo al más viejo.

        **La paginación es por cursor, no por página.** `?pagina=2` sobre una
        tabla que crece repite un documento y se salta otro, porque entre las
        dos llamadas entraron filas. El `siguiente` que devuelve esta ruta es la
        posición exacta de la última fila entregada; páselo tal cual y la
        frontera no se mueve pase lo que pase. Es opaco a propósito: quien lo
        desarme se rompe el día que cambie el orden.

        **Un documento RECHAZADO no está aquí**, y no es un olvido: un rechazo
        no es un documento fiscal y su fila dejaría el `numeroControl` retenido
        para siempre. Si al reconciliar aparece un hueco en su numeración,
        pregunte por ese código con `GET /v1/dte/{codigoGeneracion}`, que sí
        contesta por los rechazados.

        Cada resumen puede incluir el nombre y número de documento del receptor.
        En el modo privado de clientes, la API abre esos dos campos en el
        servidor para responder a una llave con alcance `query`; el cifrado en
        reposo no los oculta a esa integración autorizada. Trate la respuesta
        como datos personales y no la copie a logs generales. El listado no
        devuelve el JSON fiscal firmado ni el JWS completo.
      parameters:
        - name: desde
          in: query
          schema: { type: string, format: date }
          description: Fecha de emisión, inclusive.
          example: "2026-09-01"
        - name: hasta
          in: query
          schema: { type: string, format: date }
          description: Fecha de emisión, inclusive.
        - name: estado
          in: query
          schema: { type: string, enum: [contingencia, firmado, invalidado, sellado] }
          description: En español, el mismo vocabulario que devuelve la consulta.
        - name: tipoDte
          in: query
          schema: { type: string, pattern: "^\\d{2}$" }
          example: "03"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
          description: 'Pedir más de 100 no es un error: se sirven 100.'
        - name: cursor
          in: query
          schema: { type: string }
          description: El `siguiente` de la página anterior, tal cual.
        - name: include
          in: query
          schema: { type: string, enum: [dte] }
          description: "`dte` agrega `archivoDte` a cada fila (alcance `download`; página de 20 por defecto, 25 como máximo)."
        - $ref: "#/components/parameters/DebugTimings"
      responses:
        "200":
          description: La página, de la más nueva a la más vieja.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginaDeDocumentos" }
        "400":
          description: Una fecha mal escrita, un estado que no existe, un cursor inventado, un `include` desconocido o `include_limit_exceeded` (más de 25 filas con `include=dte`).
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/NoAutorizado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "429": { $ref: "#/components/responses/Techo" }
        "503": { $ref: "#/components/responses/NoDisponible" }

  /v1/dte/prepare:
    post:
      tags: [Emisión]
      operationId: prepararDte
      summary: Reservar el correlativo y obtener el documento canónico
      description: |
        **Alcance: `issue`.** Aquí NO se abre el vault de firma, así que esta
        ruta no pide `X-Facta-Sign-Key`: reservar y construir es todo lo que un
        token robado puede hacer, y firmar no está entre esas dos cosas.

        Para quien quiere ver el documento —y sus totales— antes de firmarlo.

        **Reserva el correlativo**, así que un `prepare` sin su `sign` deja un
        número entregado. Eso es un hueco que alguien tiene que explicar, y por
        eso `prepareToken` vence a los 15 minutos.

        `prepareToken` no es una credencial: sola no firma nada. Es un MAC sobre
        el hash canónico del documento, y su único trabajo es garantizar que lo
        que se firma es lo que obtuvo ese número. El hash se calcula sobre el
        JSON con las claves ORDENADAS, así que un cliente que reordene el objeto
        al deserializarlo (PHP, Go, Python viejo) sigue verificando.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestFingerprint"
        - $ref: "#/components/parameters/DebugTimings"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SolicitudDte" }
      responses:
        "200":
          description: Correlativo reservado; el documento todavía no está firmado.
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DtePreparado" }
        "400": { description: "Cuerpo mal formado, de más de 1 MB, o falta `Idempotency-Key`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/NoAutorizado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "409": { $ref: "#/components/responses/EnVuelo" }
        "422": { description: "`validation_failed` — no gasta correlativo.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/Techo" }
        "503": { $ref: "#/components/responses/NoDisponible" }

  /v1/dte/sign:
    post:
      tags: [Emisión]
      operationId: firmarDte
      summary: Firmar y transmitir un documento preparado
      description: |
        **Alcance: `issue`.** Y `X-Facta-Sign-Key`.

        Firma con el certificado del emisor y transmite al MH. El cuerpo
        devuelve el documento tal cual salió de `prepare`, junto con su
        `prepareToken`.

        Si el documento cambió aunque sea un centavo, la respuesta es 422
        `prepare_token_invalid` y no se firma nada.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/SignKey"
        - $ref: "#/components/parameters/DeferCopies"
        - $ref: "#/components/parameters/DebugTimings"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SolicitudFirma" }
      responses:
        "200":
          description: Sellado por el MH.
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DteSellado" }
        "202":
          description: Firmado sin respuesta del MH; queda en contingencia.
          content: { application/json: { schema: { $ref: "#/components/schemas/DteEnContingencia" } } }
        "400": { description: "Cuerpo mal formado, de más de 1 MB, o falta `Idempotency-Key`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/NoAutorizado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "409": { $ref: "#/components/responses/EnVueloOSinVault" }
        "422":
          description: "`prepare_token_invalid` (vencido, de otra llave, o el documento cambió) o `mh_rejected`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { $ref: "#/components/responses/Techo" }
        "502": { $ref: "#/components/responses/MhCaido" }
        "503": { $ref: "#/components/responses/NoDisponible" }

  /v1/dte/{codigoGeneracion}:
    get:
      tags: [Consulta]
      operationId: consultarDte
      summary: Consultar un documento por su código de generación
      description: |
        **Alcance: `query`.**

        Responde para un documento sellado **y también para uno rechazado**, que
        no tiene fila de índice pero sí reserva. Devolver 404 para un número que
        Hacienda negó mandaría al integrador a buscar un bug que no existe.
      parameters:
        - name: codigoGeneracion
          in: path
          required: true
          schema: { type: string, format: uuid }
          example: 7875BC7A-9580-441D-94E4-FA455E9D8BD0
      responses:
        "200":
          description: El documento, en el estado en que esté.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DteConsultado" }
        "400": { description: El código no tiene forma de UUID., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/NoAutorizado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { description: No existe en la empresa de la llave., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/Techo" }
        "503": { $ref: "#/components/responses/NoDisponible" }

  /v1/dte/{codigoGeneracion}/invalidate:
    post:
      tags: [Emisión]
      operationId: anularDte
      summary: Anular un documento que Hacienda ya selló
      description: |
        **Alcance: `issue`.** Y `X-Facta-Sign-Key`: la anulación se firma con el
        certificado del emisor, igual que el documento que anula.

        **Una anulación no es un borrado.** Es un EVENTO: su propio documento
        firmado, con su propio código de generación y su propio sello, enviado a
        otro servicio del Ministerio. El documento anulado no desaparece de
        ningún registro — cambia de estado, y esta ruta devuelve el sello que lo
        prueba. No hay forma de deshacerla.

        **No gasta correlativo, y aun así exige `Idempotency-Key`**: un reintento
        por timeout mandaría un segundo evento contra un documento que el
        primero ya anuló.

        **Los tres tipos no son intercambiables** (CAT-024):

        · `1` error en el documento — lo anula JUNTO CON el que lo reemplaza,
          así que `codigoGeneracionReemplazo` es obligatorio, y `motivo` también.
          Emita primero el documento correcto.
        · `2` rescisión de la operación — no nombra reemplazo, y nombrarlo es un
          error (el campo 110 tiene que ir vacío).
        · `3` otro — como el 1: reemplazo y motivo.

        Solo se anula un documento **con sello**. Un rechazo nunca existió para
        Hacienda, y su correlativo lo reutiliza el documento corregido (§167).

        **Un documento con eventos de retorno no se anula**: contesta 409
        `has_return_events`, porque Hacienda lo rechaza («DTE ESTÁ RELACIONADO
        CON OTRO DTE», Anexo V 44.4). Corríjalo con más eventos de retorno o con una
        nota de crédito.

        Pedir la anulación de algo **ya anulado** contesta 200 con
        `yaEstabaInvalidado: true`. Un reintento que recibe un error enseña a
        hacer algo peor.
      parameters:
        - name: codigoGeneracion
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/SignKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SolicitudAnulacion" }
            examples:
              rescision:
                summary: El cliente desistió de la compra
                value:
                  tipoAnulacion: 2
                  responsable: { nombre: "Ana Rivas", tipoDocumento: "36", numDocumento: "06142803901121" }
                  solicita: { nombre: "Ana Rivas", tipoDocumento: "36", numDocumento: "06142803901121" }
              errorConReemplazo:
                summary: Salió con el monto equivocado y ya se emitió el correcto
                value:
                  tipoAnulacion: 1
                  motivo: "El precio unitario iba sin el descuento pactado"
                  codigoGeneracionReemplazo: "7875BC7A-9580-441D-94E4-FA455E9D8BD0"
                  responsable: { nombre: "Ana Rivas", tipoDocumento: "36", numDocumento: "06142803901121" }
                  solicita: { nombre: "Beto Cruz", tipoDocumento: "13", numDocumento: "012345678" }
      responses:
        "200":
          description: Anulado, con el sello del evento.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DteAnulado" }
        "400": { description: "Cuerpo mal formado, o falta `Idempotency-Key`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/NoAutorizado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { description: No existe ese documento en la empresa de la llave., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409":
          description: |
            `has_return_events` (el documento ya tiene eventos de retorno registrados
            y Hacienda no permite anularlo; no se mandó nada),
            `idempotency_in_flight` (la primera petición con esa llave todavía
            trabaja) o `sign_vault_missing` (la llave no está provisionada
            para firmar). El `code` los distingue.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: |
            `validation_failed` (el documento no tiene sello, o el evento no
            cumple el esquema) o `mh_rejected` (Hacienda leyó la anulación y la
            negó — el plazo vencido es la razón más común).
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { $ref: "#/components/responses/Techo" }
        "502":
          description: |
            `mh_unreachable` — no llegamos a Hacienda, así que **no se anuló
            nada** y el documento sigue vivo. Reintente con la MISMA
            `Idempotency-Key`.

            Aquí sí ocurre, a diferencia de la emisión: un DTE firmado existe y
            se le debe a Hacienda, pero un evento que no llegó no anuló nada.
          headers:
            Retry-After: { $ref: "#/components/headers/RetryAfter" }
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503": { $ref: "#/components/responses/NoDisponible" }

  /v1/dte/{codigoGeneracion}/return:
    post:
      tags: [Emisión]
      operationId: registrarRetorno
      summary: Registrar el evento de retorno de una factura que Hacienda ya selló
      description: |
        **Alcance: `issue`.** Y `X-Facta-Sign-Key`: el evento se firma con el
        certificado del emisor, igual que el documento al que se aplica.

        **Un evento de retorno no anula ni borra nada.** Es un EVENTO de retorno
        (CAT-002 18): su propio documento firmado, con su propio código de
        generación y su propio sello. Se aplica a una factura **(01)**, una
        factura de exportación **(11)** o una factura de sujeto excluido
        **(14)** con sello, que esta API haya emitido. **No gasta correlativo.**

        **Se pueden registrar varias sobre el mismo documento**, hasta sumar lo
        que se vendió. Hacienda lleva esa suma y rechaza el exceso; Facta la
        lleva también, línea por línea, y lo refuta antes de firmar:
        `disponible` en la respuesta (y en `GET /v1/dte/{codigoGeneracion}`) dice
        cuánto queda de cada línea.

        **Las líneas se cuentan desde 1**, como las lee una persona en la
        factura: `linea: 1` es la primera. Cada item lleva **una** de dos formas:

        · `cantidad` — unidades que regresan de esa línea. El precio, la
          descripción y los tributos se copian de la original, y el descuento se
          prorratea por la parte devuelta.
        · `noGravado` — un cargo (positivo) o abono (negativo) que no afecta la
          base imponible (Manual Funcional §XII). Solo mueve el total a pagar,
          no se puede devolver más de lo que traía la línea ni con el signo
          contrario, y una FSE no lo admite.

        **El plazo**: tres meses desde que el documento se generó o se selló
        (el que venza antes), o dos años para facturas de ciertas actividades
        económicas. `fechaEvento` (por defecto, hoy en El Salvador) no puede ser
        anterior al documento ni posterior a ese plazo.

        **No gasta correlativo, y aun así exige `Idempotency-Key`**: un reintento
        por timeout quitaría las mismas unidades del documento dos veces.

        **Si no llegamos a Hacienda contesta 202**, con `estado: firmado`: el
        evento quedó firmado y registrado —sus unidades ya cuentan como devueltas
        para el saldo—, y se le debe a Hacienda como se le debe un DTE en
        contingencia. Reintente con la **misma** `Idempotency-Key` y el mismo
        cuerpo: se reenvía exactamente el mismo `jws`, nunca se arma un segundo
        evento.

        **Un documento con eventos de retorno sellados ya no se puede anular**:
        `/invalidate` contesta 409 `has_return_events` (Anexo V 44.4). Un evento
        que quedó `firmado` y nunca llegó a Hacienda no lo bloquea, y se puede
        abandonar con `DELETE /v1/dte/{codigoGeneracion}/return/{evento}`; pasadas
        72 horas sin veredicto Facta lo abandona sola.

        **El archivo del evento** se descarga con su propio código en
        `GET /v1/dte/{codigoGeneracion}/file`, en JSON o en PDF (hoja carta), y
        se puede rearmar siempre porque Facta guarda la firma del evento. La
        respuesta ya trae el PDF en `representacionGrafica` (base64). Para
        contarlo en sus destinos propios, escríbalo con el código del evento y
        avíselo en `POST /v1/storage/copies/{codigoGeneracion}/byos`.

        **Si Hacienda dice que ya tiene el evento**, o en el reintento de un
        202, Facta le pregunta qué guarda (`consultadte`) y asienta el sello o
        el rechazo en vez de dejarlo pendiente. Solo reenvía el evento cuando
        Hacienda no tiene registro de él.
      parameters:
        - name: codigoGeneracion
          in: path
          required: true
          description: El código del documento que se devuelve (no el del evento).
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/SignKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SolicitudRetorno" }
            examples:
              unidades:
                summary: Regresa una de las tres camisas
                value:
                  items: [{ linea: 1, cantidad: 1 }]
              variasLineas:
                summary: Regresan dos líneas, con la fecha de hoy explícita
                value:
                  items: [{ linea: 1, cantidad: 2 }, { linea: 2, cantidad: 1 }]
                  fechaEvento: "2026-10-06"
              abono:
                summary: Se devuelve un abono que no afecta la base
                value:
                  items: [{ linea: 3, noGravado: -1.5 }]
      responses:
        "200":
          description: Sellado por Hacienda, con el sello del evento y lo que queda por devolver.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetornoSellado" }
        "202":
          description: |
            Hacienda no contestó. El evento está firmado y registrado, y se le
            debe. Reintente con la misma `Idempotency-Key` para reenviarlo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetornoPendiente" }
        "400": { description: "Cuerpo mal formado (`details.field` dice cuál campo), o falta `Idempotency-Key`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/NoAutorizado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { description: No existe ese documento en la empresa de la llave, o esta API no tiene su JSON firmado (solo devuelve los que ella emitió)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { $ref: "#/components/responses/EnVueloOSinVault" }
        "422":
          description: |
            Lo que se pide no se puede registrar:

            · `return_exceeds_available` — más de lo que queda; `details.lineas`
              trae, por cada línea, `linea`, `solicitado` y `disponible`.
            · `return_window_closed` — `fechaEvento` fuera del plazo.
            · `return_type_not_allowed` — el documento no es 01, 11 ni 14.
            · `validation_failed` — el documento no tiene sello, está anulado, o
              el evento no cumple el esquema oficial.
            · `mh_rejected` — Hacienda leyó el evento de retorno y la negó. Sus
              unidades vuelven al saldo.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { $ref: "#/components/responses/Techo" }
        "503": { $ref: "#/components/responses/NoDisponible" }

  /v1/dte/{codigoGeneracion}/return/{evento}:
    delete:
      tags: [Emisión]
      operationId: abandonarRetorno
      summary: Abandonar un evento de retorno que quedó firmado y nunca llegó a Hacienda
      description: |
        **Alcance: `issue`.**

        Libera las unidades de un evento `firmado` que no tuvo veredicto (Hacienda
        no contestó y el reintento no fue posible). Solo se abandona un evento
        `firmado`: uno `sellado` es definitivo (422 `validation_failed`, «ya tiene
        veredicto») y uno `rechazado` ya devolvió sus unidades. Repetir la llamada
        sobre uno abandonado contesta 200 igual.

        **Antes de abandonar, confirme con Hacienda** que no tiene el evento: si
        lo selló y se abandona aquí, sus unidades quedan libres en Facta pero no en
        Hacienda, que llevará la suma por su cuenta y rechazará el exceso.
      parameters:
        - name: codigoGeneracion
          in: path
          required: true
          description: El código del documento al que se aplica el evento.
          schema: { type: string, format: uuid }
        - name: evento
          in: path
          required: true
          description: El `codigoGeneracion` del evento de retorno.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: El evento quedó abandonado y sus unidades volvieron al saldo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  codigoGeneracion: { type: string, format: uuid }
                  estado: { type: string, enum: [abandonado] }
        "400": { description: Algún código no tiene forma de UUID., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/NoAutorizado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { description: Ese evento no existe sobre ese documento en la empresa de la llave., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: El evento ya tiene veredicto (`sellado` o `rechazado`) y no se abandona., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/Techo" }
        "503": { $ref: "#/components/responses/NoDisponible" }

  /v1/dte/{codigoGeneracion}/file:
    get:
      tags: [Almacenamiento]
      operationId: descargarDocumentoRetenido
      summary: Descargar JSON/PDF o regenerar un ticket de un DTE sellado
      description: |
        **Alcance: `download`.**

        El área de retención dura **una hora** desde que el documento se
        firmó — nunca es el archivo fiscal de nadie, es la red para cuando su
        propia escritura al destino falla. **Pasada esa hora esta ruta sigue
        contestando**: el documento se rearma desde la reserva, que guarda el
        JWS sellado. El JSON son los mismos bytes; la representación carta se
        vuelve a dibujar con el sello que ya está en el índice. `kind=ticket`
        regenera un PDF de ticket en el ancho solicitado; su contenido legal
        viene del mismo DTE sellado y puede descargarse otra vez sin emitir.

        **También sirve para un evento de retorno**, con el código de su EVENTO
        (`codigoGeneracion` de la respuesta de `/return`): `kind=json` entrega el
        JSON del evento mientras el área de retención o el almacenamiento
        administrado lo tengan y, pasado eso, lo rearma de la firma que Facta guarda
        con cada evento sellado. `kind=pdf` entrega la hoja carta guardada o la
        dibuja de nuevo desde esa firma; si el evento no la guardó, o se pide
        `kind=ticket` (un evento de retorno no tiene ticket), contesta 404
        `return_pdf_unavailable`.

        Lo que NO puede rearmar son los documentos emitidos desde la app: esos
        viajan cifrados con una llave que vive en un navegador y que ningún
        servidor tiene. La respuesta entonces es la misma que si no existieran.
        Los tickets son representaciones PDF generadas al solicitar cada
        descarga y no reemplazan el JSON/JWS fiscal.

        **Dos formas del JSON — cambio de comportamiento de la descarga por
        defecto.** Hasta ahora `kind=json` devolvía el JSON guardado tal cual,
        `{codigoGeneracion, ambiente, jws}`. Ahora devuelve por defecto el
        **Archivo DTE**: el documento legible más `firmaElectronica` (el JWS,
        byte por byte) y `selloRecibido`, el mismo archivo que recibe el
        receptor y el mismo texto que trae `archivoDte` en la respuesta de
        emisión y el adjunto del correo. Se arma desde lo que haya guardado
        (el JSON de retención, el registro de la app o un archivo de receptor),
        con el sello del propio archivo o, si no lo trae, del índice. Con
        `raw=true` se entregan los bytes guardados, exactamente. La cabecera
        `X-Facta-Json-Format` dice cuál llegó: `archivo-dte` o `raw`. Un
        documento en contingencia (sin sello) no tiene Archivo DTE: la
        descarga por defecto contesta `409 not_sealed` y `raw=true` sigue
        funcionando. Si usted archivaba el JSON de esta ruta esperando el
        formato `{codigoGeneracion, ambiente, jws}`, agregue `raw=true`.

        `paperWidthMm` solo se acepta con `kind=ticket`; admite enteros de
        40 a 120 mm, por defecto 80 mm. Respeta la plantilla de ticket vigente
        de la empresa. La factura carta y su PDF no se redimensionan.

        La ruta al bucket la deriva el servidor de la fila — company_id y
        environment salen de TU llave, nunca del cuerpo ni de la URL — así
        que no hay forma de pedir el documento de otra empresa nombrando otro
        `codigoGeneracion`: si no es tuyo, la respuesta es la MISMA que si no
        existiera (ver `NoEnElArea`).
      security:
        - FactaApiKey: []
      parameters:
        - $ref: "#/components/parameters/DebugTimings"
        - name: codigoGeneracion
          in: path
          required: true
          schema: { type: string, format: uuid }
          example: 7875BC7A-9580-441D-94E4-FA455E9D8BD0
        - name: kind
          in: query
          required: false
          schema: { type: string, enum: [json, pdf, ticket], default: json }
        - name: paperWidthMm
          in: query
          required: false
          description: Solo para kind=ticket. Ancho de rollo compatible con el renderizador de Facta.
          schema: { type: integer, minimum: 40, maximum: 120, default: 80 }
        - name: raw
          in: query
          required: false
          description: Solo para kind=json. `true` entrega los bytes guardados tal cual, sin convertirlos en Archivo DTE. Por defecto (`false`) se entrega el Archivo DTE.
          schema: { type: boolean, default: false }
        - name: source
          in: query
          required: false
          description: Solo para JSON/PDF. Exige leer la copia administrada verificada; no usa retención ni regeneración como alternativa. Si se omite, conserva la selección automática del servidor.
          schema: { type: string, enum: [managed] }
      responses:
        "200":
          description: kind=json es el Archivo DTE (o los bytes guardados con raw=true); PDF carta son bytes originales o regenerados; ticket se renderiza en el ancho pedido.
          headers:
            X-Facta-Json-Format: { schema: { type: string, enum: [archivo-dte, raw] }, description: Solo con kind=json. `archivo-dte` es el documento con firmaElectronica y selloRecibido; `raw` son los bytes guardados. }
            Content-Disposition: { schema: { type: string }, description: 'attachment; filename="<codigoGeneracion>.json|pdf" o "<codigoGeneracion>-ticket.pdf"' }
            X-Facta-Storage-Source: { schema: { type: string, enum: [managed, holding, archive] }, description: Origen seleccionado por la API; ausente en servidores anteriores. }
          content:
            application/json:
              schema:
                type: object
                description: El Archivo DTE (por defecto) con `identificacion`, el resto del documento, `firmaElectronica` y `selloRecibido`; con `raw=true`, `{codigoGeneracion, ambiente, jws}`.
                properties:
                  codigoGeneracion: { type: string, format: uuid }
                  ambiente: { type: string, enum: ["00", "01"] }
                  jws: { type: string }
                  identificacion: { type: object }
                  firmaElectronica: { type: string }
                  selloRecibido: { type: string }
            application/pdf:
              schema: { type: string, format: binary }
        "400": { description: Código de generación o parámetros kind/paperWidthMm/raw inválidos., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/NoAutorizado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEnElArea" }
        "409": { description: "`not_sealed`: el documento está en contingencia y todavía no tiene sello, así que no tiene Archivo DTE. `details` trae `estado` y la pista `raw=true`.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/Techo" }
        "503": { $ref: "#/components/responses/NoDisponible" }

  /v1/dte/{codigoGeneracion}/entrega/correo:
    post:
      tags: [Entrega]
      operationId: entregarDtePorCorreo
      summary: Enviar por correo un documento recién emitido
      description: |
        **Alcance: `issue` (o `entrega:correo`).** Y el `token` que devolvió la emisión.

        Envía a la dirección que la emisión marcó (`entrega.correo`) el JSON
        firmado y el PDF, con la plantilla de correo de la empresa. La cuota,
        el plan y el remitente son los mismos que usa la app: lo decide el
        servicio de correo de Facta, no esta ruta.

        **Es idempotente por canal.** La primera llamada inicia el envío; las
        siguientes no mandan otro correo y devuelven el estado en que está,
        incluso pasados los 5 minutos. Sin respuesta del proveedor en unos
        8 segundos contesta `202` con `en_proceso` y el envío sigue; el
        resultado final se lee con `GET /v1/dte/{codigoGeneracion}/entrega`.

        Un fallo de entrega (`fallido` con su `motivo`) es un **200**: la
        petición se atendió y el canal no pudo. Los errores HTTP son del token,
        del alcance o de la petición.
      parameters:
        - $ref: "#/components/parameters/CodigoGeneracion"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SolicitudEntrega" }
      responses:
        "200":
          description: El estado final del canal (o el estado ya alcanzado, si se repite la llamada).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntregaDeCanal" }
        "202":
          description: El proveedor no contestó a tiempo; el envío sigue y su estado es `en_proceso`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntregaDeCanal" }
        "400": { $ref: "#/components/responses/EntregaPeticionInvalida" }
        "401": { $ref: "#/components/responses/EntregaNoAutorizada" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "409": { $ref: "#/components/responses/EntregaCanalNoMarcado" }
        "410": { $ref: "#/components/responses/EntregaVencida" }
        "429": { $ref: "#/components/responses/Techo" }
        "503": { $ref: "#/components/responses/NoDisponible" }

  /v1/dte/{codigoGeneracion}/entrega/whatsapp:
    post:
      tags: [Entrega]
      operationId: entregarDtePorWhatsapp
      summary: Enviar por WhatsApp un documento recién emitido
      description: |
        **Alcance: `issue` (o `entrega:whatsapp`).** Y el `token` que devolvió la emisión.

        Envía al número que la emisión marcó (`entrega.whatsapp.numero`) la
        plantilla aprobada de Facta con el PDF adjunto. **Nada más**: ni
        imagen promocional ni contenido publicitario. Se cobra de la billetera
        prepagada de WhatsApp de la empresa; sin saldo el estado es
        `sin_credito`. Si la emisión mandó
        `entrega.whatsapp.consentimiento: false`, el estado es
        `sin_consentimiento` y no se manda nada.

        **Es idempotente por canal** y responde igual que `/entrega/correo`:
        `200` con el estado final, o `202` `en_proceso` si el proveedor tarda
        más de unos 8 segundos. Si Meta contesta de forma ambigua el estado es
        `fallido` con `motivo: outcome_unknown` y **no se reenvía solo**: puede
        que el mensaje sí haya salido.
      parameters:
        - $ref: "#/components/parameters/CodigoGeneracion"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SolicitudEntrega" }
      responses:
        "200":
          description: El estado final del canal (o el estado ya alcanzado, si se repite la llamada).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntregaDeCanal" }
        "202":
          description: El proveedor no contestó a tiempo; el envío sigue y su estado es `en_proceso`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntregaDeCanal" }
        "400": { $ref: "#/components/responses/EntregaPeticionInvalida" }
        "401": { $ref: "#/components/responses/EntregaNoAutorizada" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "409": { $ref: "#/components/responses/EntregaCanalNoMarcado" }
        "410": { $ref: "#/components/responses/EntregaVencida" }
        "429": { $ref: "#/components/responses/Techo" }
        "503": { $ref: "#/components/responses/NoDisponible" }

  /v1/dte/{codigoGeneracion}/entrega:
    get:
      tags: [Entrega]
      operationId: consultarEntregaDte
      summary: Estado de la entrega de un documento
      description: |
        **Alcance: `query`** (o cualquiera de los dos `entrega:*`).

        El estado de cada canal marcado al emitir, con su `motivo` y la hora de
        la última actualización, y los destinos siempre enmascarados. **No
        necesita el token y sigue respondiendo después de los 5 minutos**: es
        la ruta para saber qué pasó cuando una entrega contestó `202`.

        Un documento que no marcó ningún canal responde `404 not_found`.
      parameters:
        - $ref: "#/components/parameters/CodigoGeneracion"
      responses:
        "200":
          description: Los canales del documento tal como están ahora.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EstadoDeEntrega" }
        "400": { $ref: "#/components/responses/EntregaPeticionInvalida" }
        "401": { $ref: "#/components/responses/NoAutorizado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEnElArea" }
        "429": { $ref: "#/components/responses/Techo" }
        "503": { $ref: "#/components/responses/NoDisponible" }

  /v1/dte/holding:
    get:
      tags: [Almacenamiento]
      operationId: listarAreaDeRetencion
      summary: Qué hay en tu área de retención ahora mismo
      description: |
        **Alcance: `download`.**

        Devuelve un máximo de 100 documentos recientes (50 por defecto); no
        tiene cursor y no es un historial paginado. Tampoco acepta ningún
        filtro de empresa: la única empresa posible es la de la llave. No
        devuelve rutas de bucket ni contenido — solo evidencia de estado
        (`whereLanded`, intentos, cuándo vence, cuántas veces se descargó).
      security:
        - FactaApiKey: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: La lista, más reciente primero.
          content:
            application/json:
              schema:
                type: object
                properties:
                  documentos:
                    type: array
                    items: { $ref: "#/components/schemas/DocumentoRetenido" }
        "401": { $ref: "#/components/responses/NoAutorizado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "429": { $ref: "#/components/responses/Techo" }

  /v1/customers:
    get:
      tags: [Catálogo]
      operationId: listarClientes
      summary: Listar o buscar los clientes de la empresa
      description: |
        **Alcance: `catalog:read`** (o `catalog:write`, que lo incluye).

        Funciona si la empresa guarda su catálogo sin cifrar, o si publicó una
        copia legible para esta llave («Catálogo legible por la API»); la
        respuesta tiene los mismos campos en los dos casos. Con el catálogo
        cifrado y sin copia, `409 catalog_encrypted` (el SDK lo descifra con
        `unlockKey`). Los clientes que esta llave fue acuñada para
        excluir no aparecen. Orden estable por `id`; `siguiente` es opaco y es
        `null` cuando no hay más.

        Devuelve datos personales: la llave que lo pide tiene que cuidarse como
        una contraseña.
      parameters:
        - $ref: "#/components/parameters/CatalogoBuscar"
        - $ref: "#/components/parameters/CatalogoLimite"
        - $ref: "#/components/parameters/CatalogoCursor"
        - $ref: "#/components/parameters/CatalogoInactivos"
      responses:
        "200":
          description: Una página de clientes activos (o todos con `incluirInactivos=true`).
          content:
            application/json:
              schema:
                type: object
                required: [clientes, siguiente]
                properties:
                  clientes:
                    type: array
                    items: { $ref: "#/components/schemas/Cliente" }
                  siguiente: { type: string, nullable: true }
        "400": { $ref: "#/components/responses/CatalogoPeticionInvalida" }
        "401": { $ref: "#/components/responses/NoAutorizado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "409": { $ref: "#/components/responses/CatalogoCifrado" }
        "429": { $ref: "#/components/responses/Techo" }
        "503": { $ref: "#/components/responses/NoDisponible" }
    post:
      tags: [Catálogo]
      operationId: crearCliente
      summary: Crear un cliente
      description: |
        **Alcance: `catalog:write`.** Y la empresa tiene que haber permitido
        administrar el catálogo desde el API; si no, `403 catalog_write_disabled`.

        Solo el nombre es obligatorio. Lo que se manda se valida con las mismas
        reglas que el formulario de clientes de la app y se rechaza (422) en vez
        de avisarse: el DUI son 9 dígitos sin guion con su dígito verificador, el
        NIT 14 (o 9 si es el del DUI), el NRC de 2 a 8 dígitos sin guion ni
        ceros a la izquierda, la actividad sale de CAT-019 y la dirección lleva
        departamento, municipio, distrito y complemento coherentes entre sí
        (CAT-012/013/008). Si ya existe un cliente con ese documento, `409
        catalog_duplicate` y `details.id` dice cuál.

        `Idempotency-Key` es opcional aquí: crear es reversible (se desactiva).
        Con ella, repetir la misma petición devuelve el mismo cliente. Repetir la
        misma llave con OTRO cuerpo actualiza ese mismo cliente (la llave solo
        alcanza al registro que ella creó): los campos enviados lo sobrescriben,
        los omitidos se conservan, `activo` no cambia, y la respuesta es `200`
        con `actualizado: true`. Pasan las mismas validaciones y compuertas que
        `PATCH`; si el documento nuevo choca con OTRO cliente es `409
        catalog_duplicate` y la llave sigue apuntando a su registro.

        La llave identifica a ese cliente **para siempre**, no solo las 24 h que
        se recuerdan las respuestas: pasado ese plazo, repetir la llave sigue
        actualizando el cliente que creó (`200`, `actualizado: true`) en vez de
        crear uno nuevo, también si el cliente no tiene número de documento. Si
        el cliente ya no existe, la petición crea uno nuevo y la llave pasa a
        apuntarle. Dos llaves de API distintas pueden usar el mismo texto sin
        cruzarse.

        Cada escritura sube la revisión del catálogo igual que una de la app,
        así que las llaves con catálogo legible y la propia app quedan
        coherentes.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyOpcional"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClienteEntrada" }
      responses:
        "201":
          description: El cliente creado.
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema:
                type: object
                required: [cliente]
                properties:
                  cliente: { $ref: "#/components/schemas/Cliente" }
        "200":
          description: >-
            La misma `Idempotency-Key` llegó con otro cuerpo: se aplicó al cliente
            que esa llave creó (semántica de `PATCH`). También es el status de la
            repetición de esa respuesta, con `Idempotency-Replayed: true`.
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema:
                type: object
                required: [cliente, actualizado]
                properties:
                  cliente: { $ref: "#/components/schemas/Cliente" }
                  actualizado: { type: boolean, enum: [true] }
        "400": { $ref: "#/components/responses/CatalogoPeticionInvalida" }
        "401": { $ref: "#/components/responses/NoAutorizado" }
        "403": { $ref: "#/components/responses/CatalogoProhibido" }
        "409": { $ref: "#/components/responses/CatalogoConflicto" }
        "422": { $ref: "#/components/responses/CatalogoInvalido" }
        "429": { $ref: "#/components/responses/Techo" }
        "503": { $ref: "#/components/responses/NoDisponible" }

  /v1/customers/{id}:
    get:
      tags: [Catálogo]
      operationId: consultarCliente
      summary: Un cliente por su id
      description: |
        **Alcance: `catalog:read`** (o `catalog:write`).

        Un cliente de otra empresa, uno que esta llave excluye o uno que no
        existe contestan lo mismo: `404 not_found`. Un cliente desactivado sí se
        devuelve, con `activo: false`.
      parameters:
        - $ref: "#/components/parameters/CatalogoId"
      responses:
        "200":
          description: El cliente.
          content:
            application/json:
              schema:
                type: object
                required: [cliente]
                properties:
                  cliente: { $ref: "#/components/schemas/Cliente" }
        "400": { $ref: "#/components/responses/CatalogoPeticionInvalida" }
        "401": { $ref: "#/components/responses/NoAutorizado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/CatalogoNoExiste" }
        "409": { $ref: "#/components/responses/CatalogoCifrado" }
        "429": { $ref: "#/components/responses/Techo" }
        "503": { $ref: "#/components/responses/NoDisponible" }
    patch:
      tags: [Catálogo]
      operationId: editarCliente
      summary: Editar un cliente (o reactivarlo)
      description: |
        **Alcance: `catalog:write`.** Y la empresa tiene que haber permitido
        administrar el catálogo desde el API.

        Solo cambia lo que se manda; `null` borra un campo opcional. El cliente
        resultante se valida entero con las mismas reglas que al crearlo: si la
        ficha guardada trae un valor que hoy no pasaría (un NRC con guion de
        antes, por ejemplo), corríjalo en la misma petición. `{"activo": true}`
        reactiva un cliente desactivado.
      parameters:
        - $ref: "#/components/parameters/CatalogoId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClienteCambio" }
