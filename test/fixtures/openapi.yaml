                properties:
                  cliente: { $ref: "#/components/schemas/Cliente" }
        "400": { $ref: "#/components/responses/CatalogoPeticionInvalida" }
        "401": { $ref: "#/components/responses/NoAutorizado" }
        "403": { $ref: "#/components/responses/CatalogoProhibido" }
        "404": { $ref: "#/components/responses/CatalogoNoExiste" }
        "409": { $ref: "#/components/responses/CatalogoConflicto" }
        "422": { $ref: "#/components/responses/CatalogoInvalido" }
        "429": { $ref: "#/components/responses/Techo" }
        "503": { $ref: "#/components/responses/NoDisponible" }
    delete:
      tags: [Catálogo]
      operationId: desactivarCliente
      summary: Desactivar un cliente
      description: |
        **Alcance: `catalog:write`.** Y la empresa tiene que haber permitido
        administrar el catálogo desde el API.

        **No borra: desactiva.** La ficha se queda en la base, deja de salir en
        `GET /v1/customers` (salvo `incluirInactivos=true`) y deja de
        resolverse por `customerId`. Los documentos ya emitidos no cambian: cada
        uno conserva su propio receptor. Repetir la llamada es inocuo. No existe
        un borrado definitivo por el API; se reactiva con `PATCH`
        `{"activo": true}`.
      parameters:
        - $ref: "#/components/parameters/CatalogoId"
      responses:
        "200":
          description: "El cliente, ya con `activo: false`."
